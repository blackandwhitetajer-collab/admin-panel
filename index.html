<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة العقارات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { max-width: 400px; margin: 80px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .hero-img { width: 70px; height: 50px; object-fit: cover; border-radius: 6px; }
        .card { border-radius: 12px; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-section" class="container">
        <div class="card login-card p-4">
            <h4 class="text-center mb-4"><i class="fa-solid fa-lock text-primary me-2"></i>تسجيل الدخول</h4>
            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input type="password" id="password-input" class="form-control" placeholder="أدخل كلمة المرور">
            </div>
            <button onclick="login()" class="btn btn-primary w-100 mb-2">دخول</button>
            <div id="login-error" class="text-danger small text-center d-none">كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-section" class="container py-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
            <h3 class="m-0"><i class="fa-solid fa-building-user text-primary me-2"></i>إدارة العقارات والوحدات</h3>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-right-from-bracket me-1"></i>خروج</button>
        </div>

        <div class="card p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0">قائمة العقارات</h5>
                <button onclick="fetchProperties()" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-rotate me-1"></i>تحديث البيانات</button>
            </div>

            <!-- مؤشر التحميل -->
            <div id="loading-spinner" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">جاري تحميل البيانات من السيرفر...</p>
            </div>

            <!-- جدول عرض البيانات -->
            <div class="table-responsive d-none" id="table-container">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr id="table-headers">
                            <!-- سيتم توليد الأعمدة تلقائياً -->
                        </tr>
                    </thead>
                    <tbody id="properties-list">
                        <!-- سيتم توليد الصفوف تلقائياً -->
                    </tbody>
                </table>
            </div>

            <div id="empty-msg" class="text-center py-4 d-none text-muted">لا توجد عقارات للعرض حالياً.</div>
            <div id="error-msg" class="text-center py-4 text-danger d-none">حدث خطأ أثناء تحميل البيانات من n8n!</div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://n8n.hellolucidagency.com/webhook/properties';
        const PASS_CODE = 'Client@2026';

        window.onload = function() {
            if (sessionStorage.getItem('admin_logged') === 'true') {
                showAdmin();
            }
        };

        function login() {
            const pass = document.getElementById('password-input').value;
            if (pass === PASS_CODE) {
                sessionStorage.setItem('admin_logged', 'true');
                document.getElementById('login-error').classList.add('d-none');
                showAdmin();
            } else {
                document.getElementById('login-error').classList.remove('d-none');
            }
        }

        function logout() {
            sessionStorage.removeItem('admin_logged');
            document.getElementById('admin-section').classList.add('d-none');
            document.getElementById('login-section').classList.remove('d-none');
        }

        function showAdmin() {
            document.getElementById('login-section').classList.add('d-none');
            document.getElementById('admin-section').classList.remove('d-none');
            fetchProperties();
        }

        async function fetchProperties() {
            document.getElementById('loading-spinner').classList.remove('d-none');
            document.getElementById('table-container').classList.add('d-none');
            document.getElementById('error-msg').classList.add('d-none');
            document.getElementById('empty-msg').classList.add('d-none');

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get' })
                });

                if (!response.ok) throw new Error('فشل الاتصال بالشيرفر');

                const data = await response.json();
                document.getElementById('loading-spinner').classList.add('d-none');

                let items = Array.isArray(data) ? data : [data];
                let rows = items.map(item => item.json || item);

                if (rows.length === 0) {
                    document.getElementById('empty-msg').classList.remove('d-none');
                    return;
                }

                renderTable(rows);
            } catch (err) {
                console.error(err);
                document.getElementById('loading-spinner').classList.add('d-none');
                document.getElementById('error-msg').classList.remove('d-none');
            }
        }

        function renderTable(rows) {
            const headersRow = document.getElementById('table-headers');
            const tbody = document.getElementById('properties-list');

            headersRow.innerHTML = '';
            tbody.innerHTML = '';

            const keys = Object.keys(rows[0]);
            
            keys.forEach(key => {
                headersRow.innerHTML += `<th>${key}</th>`;
            });

            rows.forEach(row => {
                let tr = '<tr>';
                keys.forEach(key => {
                    let val = row[key] || '';
                    
                    if (typeof val === 'string' && (val.startsWith('http://') || val.startsWith('https://')) && (val.includes('.jpg') || val.includes('.png') || val.includes('.webp') || val.includes('cloudinary'))) {
                        let firstImg = val.split(',')[0].trim();
                        tr += `<td><img src="${firstImg}" class="hero-img" alt="صورة"></td>`;
                    } else {
                        tr += `<td>${val}</td>`;
                    }
                });
                tr += '</tr>';
                tbody.innerHTML += tr;
            });

            document.getElementById('table-container').classList.remove('d-none');
        }
    </script>
</body>
</html>
