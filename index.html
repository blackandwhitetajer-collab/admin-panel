<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة العقارات - Trust Estate</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #1e293b;
      --accent-color: #d97706;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success-color: #16a34a;
      --danger-color: #dc2626;
      --gray-color: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
    .container { max-width: 1250px; margin: 0 auto; }

    /* Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 20px 25px; border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 25px;
    }
    .header h1 { font-size: 22px; color: var(--primary-color); display: flex; align-items: center; gap: 10px; }
    .header h1 i { color: var(--accent-color); }
    
    /* Buttons & Inputs */
    .btn {
      padding: 10px 18px; border: none; border-radius: 8px; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary { background-color: var(--accent-color); color: #fff; }
    .btn-primary:hover { background-color: #b45309; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-action { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-action:hover { background: #e2e8f0; }
    .btn-top { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .btn-top:hover { background: #bae6fd; }
    .btn-danger { background: #fee2e2; color: var(--danger-color); border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fca5a5; }

    /* Controls Bar */
    .controls-bar {
      display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: space-between;
    }
    .search-box {
      flex: 1; min-width: 250px; position: relative;
    }
    .search-box input {
      width: 100%; padding: 12px 40px 12px 15px; border-radius: 8px;
      border: 1px solid var(--border-color); font-size: 14px; outline: none;
    }
    .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    /* Table */
    .table-responsive {
      background: var(--card-bg); border-radius: 12px; overflow-x: auto;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color);
    }
    table { width: 100%; border-collapse: collapse; text-align: right; font-size: 14px; }
    th { background-color: #f8fafc; color: var(--text-muted); font-weight: 700; padding: 16px; border-bottom: 2px solid var(--border-color); white-space: nowrap; }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    tr:hover { background-color: #f8fafc; }

    /* Status Badges */
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-block; }
    .badge-available { background: #dcfce7; color: var(--success-color); }
    .badge-sold { background: #fee2e2; color: var(--danger-color); }
    .badge-hidden { background: #f1f5f9; color: var(--gray-color); }

    /* Modals */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
      z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px);
    }
    .modal-content {
      background: var(--card-bg); width: 100%; max-width: 750px; border-radius: 16px;
      padding: 30px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { font-size: 18px; color: var(--primary-color); }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }

    /* Form Grid */
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full-width { grid-column: span 2; }
    .form-group label { font-size: 13px; font-weight: 600; color: var(--text-main); }
    .form-group input, .form-group select, .form-group textarea {
      padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--accent-color);
    }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1><i class="fa-solid fa-city"></i> لوحة إدارة عقارات Trust Estate</h1>
      <button class="btn btn-primary" onclick="openModal('add')">
        <i class="fa-solid fa-plus"></i> إضافة عقار جديد
      </button>
    </div>

    <!-- Controls Bar -->
    <div class="controls-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="ابحث برقم الكود، المنطقة، أو النوع...">
      </div>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>كود الوحدة</th>
            <th>النوع</th>
            <th>المنطقة</th>
            <th>المساحة</th>
            <th>السعر الإجمالي</th>
            <th>المقدم</th>
            <th>الحالة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="propertiesTableBody">
          <tr>
            <td colspan="8" class="empty-state">جاري تحميل البيانات...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal (Add / Edit) -->
  <div class="modal" id="propertyModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">إضافة عقار جديد</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <form id="propertyForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="formAction" value="add">

        <div class="form-grid">
          <div class="form-group">
            <label>كود الوحدة *</label>
            <input type="text" id="unit_code" required placeholder="مثال: TR-101">
          </div>

          <div class="form-group">
            <label>القسم *</label>
            <select id="section" required>
              <option value="سكني">سكني</option>
              <option value="تجاري">تجاري</option>
              <option value="إداري">إداري</option>
              <option value="أراضي">أراضي</option>
            </select>
          </div>

          <div class="form-group">
            <label>نوع الوحدة *</label>
            <input type="text" id="unit_type" required placeholder="مثال: شقة للبيع، فيلا، محل...">
          </div>

          <div class="form-group">
            <label>المنطقة / الموقع *</label>
            <input type="text" id="location" required placeholder="مثال: حدائق أكتوبر، الشيخ زايد...">
          </div>

          <div class="form-group">
            <label>المساحة (م²) *</label>
            <input type="number" id="area" required placeholder="150">
          </div>

          <div class="form-group">
            <label>السعر الإجمالي (ج.م) *</label>
            <input type="text" id="total_price" required oninput="formatPriceInput(this)" placeholder="مثال: 2,500,000">
          </div>

          <div class="form-group">
            <label>المقدم (ج.م)</label>
            <input type="text" id="down_payment" oninput="formatPriceInput(this)" placeholder="مثال: 250,000">
          </div>

          <div class="form-group">
            <label>نظام التقسيط</label>
            <input type="text" id="installment" placeholder="مثال: على 5 سنوات">
          </div>

          <div class="form-group">
            <label>عدد الغرف</label>
            <input type="number" id="rooms" placeholder="3">
          </div>

          <div class="form-group">
            <label>حالة العقار *</label>
            <select id="property_status" required>
              <option value="متاح" selected>متاح 🟢</option>
              <option value="تم البيع">تم البيع 🔴</option>
              <option value="مخفي">مخفي 👁️‍وق</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label>رابط الصور</label>
            <input type="url" id="image_url" placeholder="https://res.cloudinary.com/...">
          </div>

          <div class="form-group full-width">
            <label>الوصف التسويقي</label>
            <textarea id="description" rows="3" placeholder="تفاصيل الوصف والتشطيب..."></textarea>
          </div>
        </div>

        <div style="margin-top: 25px; text-align: left;">
          <button type="button" class="btn btn-action" onclick="closeModal()">إلغاء</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">حفظ البيانات</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 🔗 رابط n8n Webhook الخاص بكِ
    const WEBHOOK_URL = "https://n8n.hellolucidagency.com/webhook/properties";

    let propertiesData = [];

    // --- Price Helper Functions (منع خربطة الأسعار) ---
    function formatPrice(value) {
      if (!value && value !== 0) return "0";
      const cleanNum = String(value).replace(/[^\d.]/g, "");
      const num = parseFloat(cleanNum);
      if (isNaN(num)) return value;
      return new Intl.NumberFormat('ar-EG').format(num) + " ج.م";
    }

    function parseRawPrice(value) {
      if (!value) return "";
      return String(value).replace(/[^\d]/g, "");
    }

    function formatPriceInput(input) {
      let raw = input.value.replace(/[^\d]/g, "");
      if (raw) {
        input.value = new Intl.NumberFormat('en-US').format(parseInt(raw, 10));
      } else {
        input.value = "";
      }
    }

    // --- Initialize ---
    document.addEventListener("DOMContentLoaded", () => {
      fetchProperties();
    });

    // --- Fetch Properties (GET) ---
    async function fetchProperties() {
      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "get" })
        });
        const data = await response.json();
        propertiesData = Array.isArray(data) ? data : (data.data || []);
        renderTable(propertiesData);
      } catch (err) {
        console.error("Error fetching data:", err);
        document.getElementById("propertiesTableBody").innerHTML = `
          <tr><td colspan="8" class="empty-state">تعذر جلب البيانات. يرجى التحقق من اتصال الشبكة وسيناريو n8n.</td></tr>`;
      }
    }

    // --- Render Table ---
    function renderTable(data) {
      const tbody = document.getElementById("propertiesTableBody");
      tbody.innerHTML = "";

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty-state">لا توجد عقارات مسجلة حالياً.</td></tr>`;
        return;
      }

      data.forEach(item => {
        const status = item["حالة العقار"] || item["status"] || "متاح";
        let badgeClass = "badge-available";
        if (status === "تم البيع") badgeClass = "badge-sold";
        if (status === "مخفي") badgeClass = "badge-hidden";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${item["كود الوحدة"] || "-"}</strong></td>
          <td>${item["نوع الوحدة"] || "-"}</td>
          <td>${item["المنطقة"] || "-"}</td>
          <td>${item["المساحة"] || "-"} م²</td>
          <td>${formatPrice(item["السعر الإجمالي"])}</td>
          <td>${formatPrice(item["المقدم"])}</td>
          <td><span class="badge ${badgeClass}">${status}</span></td>
          <td>
            <div style="display: flex; gap: 6px;">
              <button class="btn btn-sm btn-top" title="رفع للأعلى" onclick="moveToTop('${item["كود الوحدة"]}')">
                <i class="fa-solid fa-arrow-up"></i> رفع
              </button>
              <button class="btn btn-sm btn-action" title="تعديل" onclick="editProperty('${item["كود الوحدة"]}')">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button class="btn btn-sm btn-danger" title="حذف" onclick="deleteProperty('${item["كود الوحدة"]}')">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // --- Move To Top (رفع للأعلى) ---
    async function moveToTop(unitCode) {
      if (!confirm(`هل تريد رفع العقار كود (${unitCode}) لأعلى القائمة؟`)) return;

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "move_top",
            unit_code: unitCode
          })
        });

        if (response.ok) {
          alert("تم رفع العقار بنجاح! 🚀");
          fetchProperties();
        } else {
          alert("حدث خطأ أثناء الرفع.");
        }
      } catch (err) {
        console.error("Error moving to top:", err);
        alert("فشل الاتصال بالخادم.");
      }
    }

    // --- Delete Property (حذف) ---
    async function deleteProperty(unitCode) {
      if (!confirm(`هل أنت متأكد من حذف العقار كود (${unitCode})؟`)) return;

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "delete",
            unit_code: unitCode
          })
        });

        if (response.ok) {
          alert("تم حذف العقار بنجاح.");
          fetchProperties();
        }
      } catch (err) {
        console.error("Error deleting:", err);
      }
    }

    // --- Open / Close Modal ---
    function openModal(mode, data = null) {
      document.getElementById("propertyForm").reset();
      document.getElementById("formAction").value = mode;

      if (mode === "add") {
        document.getElementById("modalTitle").innerText = "إضافة عقار جديد";
        document.getElementById("unit_code").disabled = false;
      } else if (mode === "edit" && data) {
        document.getElementById("modalTitle").innerText = "تعديل بيانات العقار";
        document.getElementById("unit_code").value = data["كود الوحدة"] || "";
        document.getElementById("unit_code").disabled = true; // منع تغيير الكود في التعديل
        document.getElementById("section").value = data["القسم"] || "سكني";
        document.getElementById("unit_type").value = data["نوع الوحدة"] || "";
        document.getElementById("location").value = data["المنطقة"] || "";
        document.getElementById("area").value = data["المساحة"] || "";
        
        // ضبط السعر بدون رموز لتسهيل التعديل
        document.getElementById("total_price").value = parseRawPrice(data["السعر الإجمالي"]);
        document.getElementById("down_payment").value = parseRawPrice(data["المقدم"]);
        formatPriceInput(document.getElementById("total_price"));
        formatPriceInput(document.getElementById("down_payment"));

        document.getElementById("installment").value = data["نظام التقسيط"] || "";
        document.getElementById("rooms").value = data["عدد الغرف"] || "";
        document.getElementById("property_status").value = data["حالة العقار"] || "متاح";
        document.getElementById("image_url").value = data["رابط الصور"] || "";
        document.getElementById("description").value = data["الوصف التسويقي"] || "";
      }

      document.getElementById("propertyModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("propertyModal").style.display = "none";
    }

    function editProperty(unitCode) {
      const item = propertiesData.find(p => p["كود الوحدة"] === unitCode);
      if (item) openModal("edit", item);
    }

    // --- Form Submit (Add / Update) ---
    async function handleFormSubmit(e) {
      e.preventDefault();

      const action = document.getElementById("formAction").value; // add or update
      const payload = {
        action: action,
        unit_code: document.getElementById("unit_code").value,
        section: document.getElementById("section").value,
        unit_type: document.getElementById("unit_type").value,
        location: document.getElementById("location").value,
        area: document.getElementById("area").value,
        total_price: parseRawPrice(document.getElementById("total_price").value),
        down_payment: parseRawPrice(document.getElementById("down_payment").value),
        installment: document.getElementById("installment").value,
        rooms: document.getElementById("rooms").value,
        status: document.getElementById("property_status").value,
        image_url: document.getElementById("image_url").value,
        description: document.getElementById("description").value
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert(action === "add" ? "تمت إضافة العقار بنجاح! 🎉" : "تم تعديل البيانات بنجاح! ✨");
          closeModal();
          fetchProperties();
        } else {
          alert("حدث خطأ في حفظ البيانات.");
        }
      } catch (err) {
        console.error("Error submitting form:", err);
        alert("فشل الاتصال بالخادم.");
      }
    }

    // --- Search / Filter ---
    function filterTable() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = propertiesData.filter(item => {
        return (
          (item["كود الوحدة"] && item["كود الوحدة"].toLowerCase().includes(query)) ||
          (item["المنطقة"] && item["المنطقة"].toLowerCase().includes(query)) ||
          (item["نوع الوحدة"] && item["نوع الوحدة"].toLowerCase().includes(query)) ||
          (item["حالة العقار"] && item["حالة العقار"].toLowerCase().includes(query))
        );
      });
      renderTable(filtered);
    }
  </script>
</body>
</html>
