<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة إدارة العقارات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px 0;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .action-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-success {
            background-color: #16a34a;
            color: white;
        }

        .btn-secondary {
            background-color: #64748b;
            color: white;
        }

        /* شبكة الكروت */
        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .property-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .badge-code {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.85);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 2;
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            background-color: #e2e8f0;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .images-count-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
        }

        .card-content {
            padding: 12px 15px;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.05rem;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .card-location {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .card-price {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .card-actions {
            padding: 10px 15px;
            background: #f8fafc;
            border-top: 1px solid var(--border-color);
        }

        .card-actions .btn {
            width: 100%;
            font-size: 0.9rem;
            padding: 10px;
        }

        /* النوافذ والـ Modals للموبايل */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 20px 16px;
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .close-btn {
            position: absolute;
            left: 15px;
            top: 12px;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .form-group input, 
        .form-group textarea {
            padding: 11px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px !important; 
            outline: none;
            background: #f8fafc;
            width: 100%;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: var(--primary-color);
            background: white;
        }

        /* 📸 زرار الرفع ومعرض الصور المصغرة المطور */
        .upload-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border: 2px dashed var(--primary-color);
            background: #eff6ff;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .upload-box:active {
            background: #dbeafe;
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 2px;
        }

        .upload-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: #1e40af;
        }

        .upload-hint {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* شبكة معينات الصور المصغرة */
        .thumbs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .thumb-card {
            position: relative;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #1e293b;
        }

        .thumb-card.is-main {
            border-color: #16a34a;
            box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.3);
        }

        .thumb-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-main-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #16a34a;
            color: white;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            z-index: 2;
        }

        .thumb-actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            justify-content: space-around;
            padding: 3px;
        }

        .btn-thumb {
            background: none;
            border: none;
            color: white;
            font-size: 0.7rem;
            cursor: pointer;
            padding: 2px 4px;
        }

        .btn-thumb.del { color: #f87171; }
        .btn-thumb.star { color: #facc15; }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-bottom: 5px;
        }

        .modal-actions .btn {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
        }

        @media (min-width: 640px) {
            body { padding: 24px; }
            .form-grid { grid-template-columns: 1fr 1fr; }
            .form-group.full-width { grid-column: span 2; }
            .modal-content { padding: 25px; }
            .header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>لوحة إدارة العقارات</h1>
            <p>إدارة وتحديث بيانات العقارات بسهولة من الموبايل</p>
        </div>

        <div class="action-bar">
            <button type="button" class="btn btn-primary" onclick="openAddModal()">
                ➕ إضافة عقار جديد
            </button>
        </div>

        <div id="propertiesGrid" class="properties-grid">
            <!-- الكروت ستظهر هنا -->
        </div>
    </div>

    <!-- 1️⃣ نافذة إضافة عقار جديد -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeAddModal()">&times;</span>
            <h2 style="font-size: 1.3rem;">➕ إضافة عقار جديد</h2>
            
            <form onsubmit="event.preventDefault(); submitAddProperty();">
                <div class="form-grid">
                    <div class="form-group">
                        <label>كود الوحدة *</label>
                        <input type="text" id="addCode" required placeholder="مثال: 101">
                    </div>
                    <div class="form-group">
                        <label>القسم</label>
                        <input type="text" id="addSection" placeholder="مثال: للبيع / للإيجار">
                    </div>
                    <div class="form-group">
                        <label>نوع الوحدة</label>
                        <input type="text" id="addType" placeholder="مثال: شقة / فيلا">
                    </div>
                    <div class="form-group">
                        <label>المنطقة</label>
                        <input type="text" id="addRegion" placeholder="مثال: حي الأشجار">
                    </div>
                    <div class="form-group">
                        <label>المساحة</label>
                        <input type="text" id="addArea" placeholder="مثال: 150 م">
                    </div>
                    <div class="form-group">
                        <label>السعر الإجمالي</label>
                        <input type="number" id="addPrice" placeholder="مثال: 2500000">
                    </div>
                    <div class="form-group">
                        <label>المقدم</label>
                        <input type="text" id="addDownPayment" placeholder="مثال: 500000">
                    </div>
                    <div class="form-group">
                        <label>نظام التقسيط</label>
                        <input type="text" id="addInstallment" placeholder="مثال: على 5 سنوات">
                    </div>
                    <div class="form-group">
                        <label>عدد الغرف</label>
                        <input type="text" id="addRooms" placeholder="مثال: 3 غرف">
                    </div>
                    <div class="form-group full-width">
                        <label>الوصف التسويقي</label>
                        <textarea id="addDesc" rows="3" placeholder="اكتبي تفاصيل العقار..."></textarea>
                    </div>

                    <!-- 📸 رفع المعاينة الحية في الإضافة -->
                    <div class="form-group full-width">
                        <label id="addImagesLabel">صور العقار (يمكن إضافة حتى 10 صور)</label>
                        <input type="file" id="addImagesInput" multiple accept="image/*" style="display: none;" onchange="handleAddFilesSelected(this)">
                        
                        <label for="addImagesInput" class="upload-box" id="addUploadBox">
                            <span class="upload-icon">📸</span>
                            <span class="upload-text">اضغطي هنا لاختيار الصور</span>
                            <span class="upload-hint">(اختر حتى 10 صور - الأولى هي الرئيسية)</span>
                        </label>

                        <!-- معينات الصور المصغرة للإضافة -->
                        <div id="addThumbsContainer" class="thumbs-grid"></div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="submit" id="saveAddBtn" class="btn btn-success">حفظ العقار</button>
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2️⃣ نافذة التعديل -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 style="font-size: 1.3rem;">📝 تعديل بيانات العقار</h2>
            
            <form onsubmit="event.preventDefault(); submitUpdate();">
                <div class="form-grid">
                    <div class="form-group">
                        <label>كود الوحدة (مغلق)</label>
                        <input type="text" id="editCode" readonly style="background:#e2e8f0;">
                    </div>
                    <div class="form-group">
                        <label>القسم</label>
                        <input type="text" id="editSection">
                    </div>
                    <div class="form-group">
                        <label>نوع الوحدة</label>
                        <input type="text" id="editType">
                    </div>
                    <div class="form-group">
                        <label>المنطقة</label>
                        <input type="text" id="editRegion">
                    </div>
                    <div class="form-group">
                        <label>المساحة</label>
                        <input type="text" id="editArea">
                    </div>
                    <div class="form-group">
                        <label>السعر الإجمالي</label>
                        <input type="number" id="editPrice">
                    </div>
                    <div class="form-group">
                        <label>المقدم</label>
                        <input type="text" id="editDownPayment">
                    </div>
                    <div class="form-group">
                        <label>نظام التقسيط</label>
                        <input type="text" id="editInstallment">
                    </div>
                    <div class="form-group">
                        <label>عدد الغرف</label>
                        <input type="text" id="editRooms">
                    </div>
                    <div class="form-group full-width">
                        <label>الوصف التسويقي</label>
                        <textarea id="editDesc" rows="3"></textarea>
                    </div>

                    <!-- 📸 إدارة وصور العقار والتعديل والإضافة -->
                    <div class="form-group full-width">
                        <label>صور العقار الحالية والجديدة</label>
                        <div id="editThumbsContainer" class="thumbs-grid"></div>

                        <!-- زرار إضافة صور جديدة في التعديل -->
                        <div style="margin-top: 10px;">
                            <input type="file" id="editNewImagesInput" multiple accept="image/*" style="display: none;" onchange="handleEditNewFilesSelected(this)">
                            <label for="editNewImagesInput" class="upload-box" id="editUploadBox" style="padding: 10px;">
                                <span style="font-size: 0.9rem; font-weight: bold; color: #1e40af;">➕ إضافة صور جديدة لهذا العقار</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="submit" id="saveModalBtn" class="btn btn-success">حفظ التعديلات</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3️⃣ المنطق والـ JavaScript الكامل -->
    <script>
        const N8N_WEBHOOK_URL = 'https://n8n.hellolucidagency.com/webhook/properties'; 
        const CLOUDINARY_CLOUD_NAME = 'fig3bixy';
        const CLOUDINARY_PRESET = 'properties_preset';

        let allProperties = [];
        
        // مصفوفات حالة الصور
        let addSelectedFiles = [];       // صور العقار الجديد (File Objects)
        let editExistingUrls = [];       // روابط الصور الموجودة أصلاً لـ العقار (Strings)
        let editNewFiles = [];           // صور إضافية جديدة للتعديل (File Objects)

        function openAddModal() {
            addSelectedFiles = [];
            document.getElementById('addImagesInput').value = '';
            renderAddThumbs();
            document.getElementById('addModal').classList.add('active');
        }

        function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }
        function closeModal() { document.getElementById('editModal').classList.remove('active'); }

        function getVal(obj, fieldName) {
            if (!obj) return '';
            if (obj[fieldName] !== undefined && obj[fieldName] !== null && String(obj[fieldName]).trim() !== '') {
                return String(obj[fieldName]).trim();
            }
            const clean = (s) => String(s || '').replace(/[أإآ]/g, 'ا').replace(/\s+/g, ' ').trim();
            const target = clean(fieldName);
            for (let key in obj) {
                if (clean(key) === target) {
                    const val = obj[key];
                    if (val !== undefined && val !== null) return String(val).trim();
                }
            }
            return '';
        }

        function formatImageUrl(url) {
            if (!url) return 'https://via.placeholder.com/400x300?text=No+Image';
            let clean = String(url).trim();
            if (clean.includes('cloudinary.com') && clean.includes('/upload/')) {
                if (!clean.includes('/f_auto/')) {
                    clean = clean.replace('/upload/', '/upload/f_auto/');
                }
            }
            return clean;
        }

        function parseImages(imagesString) {
            if (!imagesString) return [];
            return String(imagesString).split(',')
                .map(img => img.trim())
                .filter(img => img.length > 0);
        }

        // ==========================================
        // 📸 إدارة معينات الصور المصغرة في "الإضافة"
        // ==========================================
        function handleAddFilesSelected(input) {
            const files = Array.from(input.files);
            if (addSelectedFiles.length + files.length > 10) {
                alert('⚠️ الحد الأقصى المسموح به هو 10 صور فقط كحد أقصى.');
                return;
            }
            addSelectedFiles = addSelectedFiles.concat(files);
            input.value = ''; // تفريغ الخانة للسماح بالسيليكت المجدد
            renderAddThumbs();
        }

        function renderAddThumbs() {
            const container = document.getElementById('addThumbsContainer');
            container.innerHTML = '';

            addSelectedFiles.forEach((file, index) => {
                const isMain = index === 0;
                const tempUrl = URL.createObjectURL(file);

                const card = document.createElement('div');
                card.className = 'thumb-card' + (isMain ? ' is-main' : '');
                
                card.innerHTML = `
                    ${isMain ? '<span class="thumb-main-badge">الرئيسية</span>' : ''}
                    <img src="${tempUrl}" alt="معاينة">
                    <div class="thumb-actions">
                        ${!isMain ? `<button type="button" class="btn-thumb star" onclick="setAddMainImage(${index})">⭐ رئيسية</button>` : ''}
                        <button type="button" class="btn-thumb del" onclick="removeAddImage(${index})">🗑️ حذف</button>
                    </div>
                `;
                container.appendChild(card);
            });

            // تحديث زرار الرفع
            const uploadBox = document.getElementById('addUploadBox');
            if (addSelectedFiles.length >= 10) {
                uploadBox.style.display = 'none';
            } else {
                uploadBox.style.display = 'flex';
            }
        }

        function setAddMainImage(index) {
            if (index > 0 && index < addSelectedFiles.length) {
                const picked = addSelectedFiles.splice(index, 1)[0];
                addSelectedFiles.unshift(picked);
                renderAddThumbs();
            }
        }

        function removeAddImage(index) {
            addSelectedFiles.splice(index, 1);
            renderAddThumbs();
        }

        // ==========================================
        // 📸 إدارة الصور في شاشة "التعديل" (قديمة + جديدة)
        // ==========================================
        function handleEditNewFilesSelected(input) {
            const files = Array.from(input.files);
            const totalCount = editExistingUrls.length + editNewFiles.length + files.length;
            if (totalCount > 10) {
                alert('⚠️ مجموع الصور الحالي والجديد لا يمكن أن يتجاوز 10 صور.');
                return;
            }
            editNewFiles = editNewFiles.concat(files);
            input.value = '';
            renderEditThumbs();
        }

        function renderEditThumbs() {
            const container = document.getElementById('editThumbsContainer');
            container.innerHTML = '';

            // 1. عرض الصور القديمة أولاً
            editExistingUrls.forEach((url, index) => {
                const isMain = index === 0;
                const card = document.createElement('div');
                card.className = 'thumb-card' + (isMain ? ' is-main' : '');
                
                card.innerHTML = `
                    ${isMain ? '<span class="thumb-main-badge">الرئيسية</span>' : ''}
                    <img src="${formatImageUrl(url)}" alt="صورة">
                    <div class="thumb-actions">
                        ${!isMain ? `<button type="button" class="btn-thumb star" onclick="setEditExistingMain(${index})">⭐ رئيسية</button>` : ''}
                        <button type="button" class="btn-thumb del" onclick="removeEditExistingImage(${index})">🗑️ حذف</button>
                    </div>
                `;
                container.appendChild(card);
            });

            // 2. عرض الصور الجديدة المضافة محلياً
            editNewFiles.forEach((file, index) => {
                const globalIndex = editExistingUrls.length + index;
                const isMain = globalIndex === 0;
                const tempUrl = URL.createObjectURL(file);

                const card = document.createElement('div');
                card.className = 'thumb-card' + (isMain ? ' is-main' : '');
                
                card.innerHTML = `
                    <span style="position:absolute; top:2px; left:2px; background:#2563eb; color:white; font-size:0.6rem; padding:1px 3px; border-radius:3px;">جديدة</span>
                    ${isMain ? '<span class="thumb-main-badge">الرئيسية</span>' : ''}
                    <img src="${tempUrl}" alt="صورة">
                    <div class="thumb-actions">
                        ${!isMain ? `<button type="button" class="btn-thumb star" onclick="setEditNewMain(${index})">⭐ رئيسية</button>` : ''}
                        <button type="button" class="btn-thumb del" onclick="removeEditNewImage(${index})">🗑️ حذف</button>
                    </div>
                `;
                container.appendChild(card);
            });

            // إخفاء أو إظهار زرار الإضافة
            const total = editExistingUrls.length + editNewFiles.length;
            document.getElementById('editUploadBox').style.display = total >= 10 ? 'none' : 'block';
        }

        function setEditExistingMain(index) {
            const picked = editExistingUrls.splice(index, 1)[0];
            editExistingUrls.unshift(picked);
            renderEditThumbs();
        }

        function removeEditExistingImage(index) {
            editExistingUrls.splice(index, 1);
            renderEditThumbs();
        }

        function setEditNewMain(index) {
            const picked = editNewFiles.splice(index, 1)[0];
            // لو خليناها رئيسية نحولها لأول المصفوفة
            if (editExistingUrls.length > 0) {
                // نسحبها ونحطها في بداية الصور المرفوعة بعد رفعه لـ كلاوديناري عند الحفظ
            }
            editNewFiles.splice(index, 1);
            editNewFiles.unshift(picked);
            renderEditThumbs();
        }

        function removeEditNewImage(index) {
            editNewFiles.splice(index, 1);
            renderEditThumbs();
        }

        // ==========================================
        // 📤 دالة الرفع الفعلية لـ Cloudinary
        // ==========================================
        async function uploadFilesListToCloudinary(filesArray) {
            if (filesArray.length === 0) return [];
            const uploadedUrls = [];
            for (let i = 0; i < filesArray.length; i++) {
                const formData = new FormData();
                formData.append('file', filesArray[i]);
                formData.append('upload_preset', CLOUDINARY_PRESET);

                try {
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();
                    if (data.secure_url) {
                        uploadedUrls.push(data.secure_url);
                    } else {
                        alert(`❌ خطأ في كلاوديناري بالصورة (${i+1}): ` + (data.error?.message || 'تأكدي من الـ Preset'));
                        return null;
                    }
                } catch (err) {
                    alert(`❌ فشل الاتصال بكلاوديناري: ${err.message}`);
                    return null;
                }
            }
            return uploadedUrls;
        }

        // ==========================================
        // 🔄 التعامل مع n8n والسيرفر
        // ==========================================
        async function fetchProperties() {
            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "get" })
                });

                if (!response.ok) throw new Error('رمز استجابة السيرفر: ' + response.status);

                const data = await response.json();
                allProperties = Array.isArray(data) ? data : (data.data || []);
                renderPropertiesGrid(allProperties);
            } catch (err) {
                console.error('خطأ في جلب البيانات:', err);
            }
        }

        function renderPropertiesGrid(properties) {
            const grid = document.getElementById('propertiesGrid');
            if (!grid) return;
            grid.innerHTML = '';

            if (properties.length === 0) {
                grid.innerHTML = '<div style="text-align:center; grid-column: 1/-1; padding: 30px; color: #64748b;">لا توجد عقارات حالياً</div>';
                return;
            }

            properties.forEach(function(item) {
                const rawImages = getVal(item, 'رابط الصور');
                const imagesList = parseImages(rawImages);
                const mainImage = imagesList.length > 0 ? formatImageUrl(imagesList[0]) : 'https://via.placeholder.com/400x300?text=No+Image';
                
                const code = getVal(item, 'كود الوحدة') || 'N/A';
                const unitType = getVal(item, 'نوع الوحدة');
                const section = getVal(item, 'القسم');
                const region = getVal(item, 'المنطقة');
                const price = getVal(item, 'السعر الإجمالي') || getVal(item, 'السعر الاجمالي');

                const card = document.createElement('div');
                card.className = 'property-card';
                card.innerHTML = `
                    <span class="badge-code">${code}</span>
                    <div class="card-image-wrapper">
                        <img src="${mainImage}" class="card-image" alt="صورة العقار" onerror="this.src='https://via.placeholder.com/400x300?text=Error'">
                        <span class="images-count-badge">📷 ${imagesList.length} صور</span>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${unitType || 'وحدة عقارية'} ${section ? '- ' + section : ''}</h3>
                        <div class="card-location">📍 ${region || 'غير محدد'}</div>
                        <div class="card-price">${price ? price + ' EGP' : 'السعر عند الطلب'}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-primary" onclick="openEditModal('${code}')">📝 تعديل والتفاصيل</button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // إرسال عقار جديد
        async function submitAddProperty() {
            const saveBtn = document.getElementById('saveAddBtn');
            saveBtn.innerText = '⏳ جاري رفع الصور...';
            saveBtn.disabled = true;

            let uploadedUrls = [];
            if (addSelectedFiles.length > 0) {
                uploadedUrls = await uploadFilesListToCloudinary(addSelectedFiles);
                if (uploadedUrls === null) {
                    saveBtn.innerText = 'حفظ العقار';
                    saveBtn.disabled = false;
                    return; 
                }
            }

            saveBtn.innerText = '⏳ جاري تسجيل العقار في الشيت...';

            const newPropertyPayload = {
                action: "add",
                "كود الوحدة": document.getElementById('addCode').value,
                "القسم": document.getElementById('addSection').value,
                "نوع الوحدة": document.getElementById('addType').value,
                "المنطقة": document.getElementById('addRegion').value,
                "المساحة": document.getElementById('addArea').value,
                "السعر الإجمالي": document.getElementById('addPrice').value,
                "المقدم": document.getElementById('addDownPayment').value,
                "نظام التقسيط": document.getElementById('addInstallment').value,
                "عدد الغرف": document.getElementById('addRooms').value,
                "الوصف التسويقي": document.getElementById('addDesc').value,
                "رابط الصور": uploadedUrls.join(', ')
            };

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newPropertyPayload)
                });

                if (response.ok) {
                    alert('✅ تم تسجيل العقار الجديد في Google Sheets بنجاح!');
                    closeAddModal();
                    
                    document.getElementById('addCode').value = '';
                    addSelectedFiles = [];
                    renderAddThumbs();
                    
                    fetchProperties();
                } else {
                    alert('❌ السيرفر رجّع خطأ أثناء الحفظ (رمز: ' + response.status + ')');
                }
            } catch (err) {
                alert('❌ فشل الاتصال بسيرفر n8n: ' + err.message);
            } finally {
                saveBtn.innerText = 'حفظ العقار';
                saveBtn.disabled = false;
            }
        }

        // فتح التعديل
        function openEditModal(code) {
            const unit = allProperties.find(p => getVal(p, 'كود الوحدة') === String(code));
            if (!unit) return;

            document.getElementById('editCode').value = getVal(unit, 'كود الوحدة');
            document.getElementById('editSection').value = getVal(unit, 'القسم');
            document.getElementById('editType').value = getVal(unit, 'نوع الوحدة');
            document.getElementById('editRegion').value = getVal(unit, 'المنطقة');
            document.getElementById('editArea').value = getVal(unit, 'المساحة');
            document.getElementById('editPrice').value = getVal(unit, 'السعر الإجمالي') || getVal(unit, 'السعر الاجمالي');
            document.getElementById('editDownPayment').value = getVal(unit, 'المقدم');
            document.getElementById('editInstallment').value = getVal(unit, 'نظام التقسيط');
            document.getElementById('editRooms').value = getVal(unit, 'عدد الغرف');
            document.getElementById('editDesc').value = getVal(unit, 'الوصف التسويقي');

            editExistingUrls = parseImages(getVal(unit, 'رابط الصور'));
            editNewFiles = [];
            renderEditThumbs();

            document.getElementById('editModal').classList.add('active');
        }

        // حفظ التعديلات
        async function submitUpdate() {
            const saveBtn = document.getElementById('saveModalBtn');
            saveBtn.innerText = '⏳ جاري رفع الصور الجديدة...';
            saveBtn.disabled = true;

            // 1. رفع الصور الجديدة لو وُجدت
            let newlyUploadedUrls = [];
            if (editNewFiles.length > 0) {
                newlyUploadedUrls = await uploadFilesListToCloudinary(editNewFiles);
                if (newlyUploadedUrls === null) {
                    saveBtn.innerText = 'حفظ التعديلات';
                    saveBtn.disabled = false;
                    return;
                }
            }

            // 2. دمج الصور القديمة المتبقية مع الجديدة المرفوعة
            const finalImagesList = editExistingUrls.concat(newlyUploadedUrls);

            saveBtn.innerText = '⏳ جاري الحفظ...';

            const updatedPayload = {
                action: "update",
                "كود الوحدة": document.getElementById('editCode').value,
                "القسم": document.getElementById('editSection').value,
                "نوع الوحدة": document.getElementById('editType').value,
                "المنطقة": document.getElementById('editRegion').value,
                "المساحة": document.getElementById('editArea').value,
                "السعر الإجمالي": document.getElementById('editPrice').value,
                "المقدم": document.getElementById('editDownPayment').value,
                "نظام التقسيط": document.getElementById('editInstallment').value,
                "عدد الغرف": document.getElementById('editRooms').value,
                "الوصف التسويقي": document.getElementById('editDesc').value,
                "رابط الصور": finalImagesList.join(', ')
            };

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedPayload)
                });

                if (response.ok) {
                    alert('✅ تم حفظ التعديلات وتحديث الصور بنجاح!');
                    closeModal();
                    fetchProperties();
                } else {
                    alert('❌ حدث خطأ أثناء التعديل');
                }
            } catch (error) {
                alert('❌ فشل الاتصال بالسيرفر');
            } finally {
                saveBtn.innerText = 'حفظ التعديلات';
                saveBtn.disabled = false;
            }
        }

        fetchProperties();
    </script>
</body>
