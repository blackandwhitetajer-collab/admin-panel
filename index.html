<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة إدارة العقارات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f3;--card:#fff;--ink:#12292f;--mut:#5d7278;--line:#d9e2e4;--pri:#0d4a55;--pri2:#0a3841;--acc:#c8962e;--ok:#1d8a5b;--bad:#c0392b;--r:14px}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Tajawal,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{background:var(--pri);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:1.25rem;font-weight:800}
.hbtns{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--acc);color:#1b1405}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.btn.sec{background:#e6eef0;color:var(--pri)}
.btn.bad{background:#fbe9e7;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
.bar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}
.bar input,.bar select,.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.stats{color:var(--mut);margin-bottom:14px;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:4/3;background:#dfe7e9}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .noimg{display:grid;place-items:center;height:100%;color:var(--mut)}
.badge{position:absolute;top:10px;right:10px;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700;color:#fff;background:var(--ok)}
.badge.sold{background:var(--bad)}.badge.hid{background:#6b7b80}
.cnt{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:2px 8px;font-size:.8rem}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb .code{color:var(--mut);font-size:.85rem}
.cb .price{font-size:1.2rem;font-weight:800;color:var(--pri)}
.cb .meta{color:var(--mut);font-size:.9rem}
.cb .ds{font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;gap:6px;padding:0 14px 14px;margin-top:auto}
.acts .btn{flex:1;padding:8px 6px;font-size:.88rem}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(10,30,35,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:50;padding:16px}
.ov.on{display:flex}
.modal{background:#fff;border-radius:var(--r);width:100%;max-width:760px;padding:20px;margin:auto}
.modal h2{margin-bottom:14px;font-size:1.2rem}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:block;font-size:.88rem;font-weight:700;margin-bottom:4px}
.f.full{grid-column:1/-1}
.f textarea{min-height:90px;resize:vertical}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.th{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#f4f7f8}
.th.hero{border-color:var(--acc)}
.th img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.th .hb{position:absolute;top:4px;right:4px;background:var(--acc);color:#1b1405;font-size:.72rem;font-weight:800;padding:1px 8px;border-radius:99px}
.th .tb{display:flex;gap:2px;padding:4px}
.th .tb button{flex:1;border:0;border-radius:6px;padding:4px 2px;font-size:.75rem;background:#e6eef0;color:var(--pri)}
.th .tb button.d{background:#fbe9e7;color:var(--bad)}
.up{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.up .st{color:var(--mut);font-size:.88rem}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:99;max-width:90%}
#toast.err{background:var(--bad)}
.ld{text-align:center;padding:40px;color:var(--mut)}
.sub{background:linear-gradient(135deg,#0d4a55,#0a3841);color:#fff;border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.sub .it small{display:block;opacity:.7;font-size:.78rem}
.sub .it b{font-size:1.05rem}
.sub .chip{display:inline-block;background:var(--acc);color:#1b1405;border-radius:99px;padding:1px 12px;font-weight:800;font-size:.9rem}
.sub .d-ok{color:#7be0b0}.sub .d-mid{color:#ffd37a}.sub .d-bad{color:#ff9d92}
.sub .pb{height:6px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:6px}
.sub .pb i{display:block;height:100%;background:var(--acc)}
.sub-err{background:#fbe9e7;color:var(--bad);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:.9rem}
.f label.tg{display:flex;align-items:center;gap:8px;cursor:pointer}
.f .tg input{width:auto}
@media(max-width:640px){.bar,.fg{grid-template-columns:1fr}header h1{font-size:1.05rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="appTitle"></h1>
  <div class="hbtns">
    <button class="btn ghost" id="btnRefresh" type="button">تحديث</button>
    <button class="btn" id="btnAdd" type="button">إضافة وحدة</button>
  </div>
</header>
<main>
  <div id="sub"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="ابحث بالكود أو المنطقة أو النوع">
    <select id="fSec"><option value="">كل الأقسام</option></select>
    <select id="fSt"><option value="">كل الحالات</option></select>
  </div>
  <div class="stats" id="stats"></div>
  <div id="list"><div class="ld">جارٍ تحميل الوحدات...</div></div>
</main>

<div class="ov" id="ov">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div class="fg">
      <div class="f"><label for="unit_code">كود الوحدة</label><input id="unit_code" type="text"></div>
      <div class="f"><label for="section">القسم</label><select id="section"></select></div>
      <div class="f"><label for="unit_type">نوع الوحدة</label><input id="unit_type" type="text"></div>
      <div class="f"><label for="location">المنطقة</label><input id="location" type="text"></div>
      <div class="f"><label for="area">المساحة</label><input id="area" type="text"></div>
      <div class="f"><label for="total_price">السعر الإجمالي</label><input id="total_price" type="text" inputmode="numeric"></div>
      <div class="f"><label for="down_payment">المقدم</label><input id="down_payment" type="text"></div>
      <div class="f"><label for="installment">نظام التقسيط</label><input id="installment" type="text"></div>
      <div class="f"><label for="rooms">عدد الغرف</label><input id="rooms" type="text" inputmode="numeric"></div>
      <div class="f"><label for="status">حالة العقار</label><select id="status"></select></div>
      <div class="f full"><label for="description">الوصف التسويقي</label><textarea id="description"></textarea></div>
      <div class="f full"><label class="tg"><input type="checkbox" id="send_notification"> إرسال إشعار Push للمشتركين</label></div>
      <div class="f full">
        <label>صور الوحدة</label>
        <div class="up">
          <button class="btn sec" id="btnPick" type="button">رفع صور</button>
          <input id="files" type="file" accept="image/*,.heic,.heif" multiple hidden>
          <span class="st" id="upSt"></span>
        </div>
        <div class="album" id="album"></div>
      </div>
    </div>
    <div class="mf">
      <button class="btn sec" id="btnCancel" type="button">إلغاء</button>
      <button class="btn" id="btnSave" type="button">حفظ</button>
    </div>
  </div>
</div>
<div class="ov" id="kov" style="z-index:60">
  <div class="modal" style="max-width:380px;margin-top:20vh" role="dialog" aria-modal="true" aria-labelledby="kTitle">
    <h2 id="kTitle">مفتاح الأمان</h2>
    <div class="f"><label for="keyIn">أدخل كلمة السر (تُطلب مرة واحدة على هذا الجهاز)</label><input id="keyIn" type="password" autocomplete="off"></div>
    <div class="mf"><button class="btn sec" id="keyCancel" type="button">إلغاء</button><button class="btn" id="keyOk" type="button">تأكيد</button></div>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
const CONFIG = {
  APP_NAME: "لوسيد إيجنسي - لوحة إدارة العقارات",
  WEBHOOK_URL: "https://n8n.hellolucidagency.com/webhook/properties",
  CLOUDINARY_CLOUD_NAME: "fig3bixy",
  CLOUDINARY_PRESET: "properties_preset",
  CLOUDINARY_FOLDER: "trust-Estate",
  ONESIGNAL_APP_ID: "",            // احجز هنا OneSignal App ID (لم يُستخدم في الإرسال بعد)
  LIST_ACTION: "properties",       // جلب العقارات العامة (بدون admin_key)
  SETTINGS_ACTION: "get_settings", // جلب بيانات تبويب Settings (مع admin_key)
  TITLE_SUFFIX: "لوحة إدارة العقارات" // يُضاف بعد brand_id في العنوان
};

const SECTIONS = ["سكني","تجاري","إداري","ساحلي","أرض","فيلا","بيع","إيجار"];
const STATUSES = ["متاح","تم البيع","مخفي"];

/* خريطة الحقول: المفتاح الإنجليزي + البدائل العربية والإنجليزية */
const FIELDS = {
  unit_code:   { ar: "كود الوحدة",       alt: ["unit_code","old_unit_code","كود الوحدة","كود الوحـدة"] },
  section:     { ar: "القسم",            alt: ["section","القسم"] },
  unit_type:   { ar: "نوع الوحدة",       alt: ["unit_type","نوع الوحدة","نوع الوحـدة"] },
  location:    { ar: "المنطقة",          alt: ["location","المنطقة"] },
  area:        { ar: "المساحة",          alt: ["area","المساحة"] },
  total_price: { ar: "السعر الإجمالي",   alt: ["total_price","price","السعر الإجمالي","السعر الاجمالي"] },
  down_payment:{ ar: "المقدم",           alt: ["down_payment","المقدم"] },
  installment: { ar: "نظام التقسيط",     alt: ["installment","نظام التقسيط"] },
  rooms:       { ar: "عدد الغرف",        alt: ["rooms","عدد الغرف"] },
  description: { ar: "الوصف التسويقي",   alt: ["description","الوصف التسويقي"] },
  status:      { ar: "حالة العقار",      alt: ["status","حالة العقار","الحالة"] },
  image_url:   { ar: "رابط الصور",       alt: ["image_url","رابط الصور"] },
  last_updated:{ ar: "آخر تحديث",        alt: ["last_updated","آخر تحديث","اخر تحديث"] }
};

/* تحويل قيمة آخر تحديث (رقم ms أو نص تاريخ) إلى رقم للمقارنة */
function ts(v){
  if (v === undefined || v === null || String(v).trim() === "") return 0;
  const s = String(v).trim().replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  if (/^\d+(\.\d+)?$/.test(s)) return Number(s);
  const t = Date.parse(s);
  return isNaN(t) ? 0 : t;
}

const $ = id => document.getElementById(id);
let rows = [];
let editing = null;      // الكود الأصلي أثناء التعديل
let album = [];          // مصفوفة روابط الصور (الهيرو = index 0)
let uploading = 0;

document.title = CONFIG.APP_NAME;
$("appTitle").textContent = CONFIG.APP_NAME;

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function pick(row, key){
  for (const k of FIELDS[key].alt){
    if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== "") return String(row[k]).trim();
  }
  return "";
}

function normalize(row){
  const o = {};
  for (const k in FIELDS) o[k] = pick(row, k);
  return o;
}

/* HEIC/HEIF -> JPG عبر تبديل الامتداد */
function fixImg(url){
  return String(url).trim().replace(/\.(heic|heif)(\?.*)?$/i, ".jpg$2");
}

function splitImages(s){
  return String(s || "").split(/\r?\n|,(?=\s*https?:)/).map(x => fixImg(x)).filter(Boolean);
}

/* تنسيق السعر: استخراج الأرقام حتى لو كانت القيمة نصاً غير مهيكل */
function fmtPrice(v){
  if (v === undefined || v === null || String(v).trim() === "") return "السعر عند الطلب";
  const ar = "٠١٢٣٤٥٦٧٨٩";
  const s = String(v).replace(/[٠-٩]/g, d => ar.indexOf(d)).replace(/[٬,\s]/g, "").replace(/٫/g, ".");
  const m = s.match(/\d+(\.\d+)?/);
  if (!m) return String(v);
  const n = parseFloat(m[0]);
  if (isNaN(n)) return String(v);
  return n.toLocaleString("en-US") + " ج.م";
}

function toast(msg, err){
  const t = $("toast");
  t.textContent = msg;
  t.className = err ? "err" : "";
  t.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.style.display = "none", 3500);
}

async function api(payload){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  try {
    const res = await fetch(CONFIG.WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    const txt = await res.text();
    if (!res.ok){ const er = new Error("الخادم رد بخطأ " + res.status + (txt ? ": " + txt.slice(0, 200) : "")); er.status = res.status; throw er; }
    if (!txt.trim()) return null;
    try { return JSON.parse(txt); } catch(e){ return txt; }
  } catch(e){
    if (e.name === "AbortError") throw new Error("انتهت مهلة الاتصال (25 ثانية) ولم يرد n8n. تأكد أن الـ Workflow مفعّل وأن نود Respond to Webhook موجود.");
    if (e instanceof TypeError) throw new Error("تعذر الوصول إلى الـ Webhook (غالباً CORS أو الرابط غير صحيح): " + e.message);
    throw e;
  } finally { clearTimeout(timer); }
}

const WRAP_KEYS = ["data","properties","rows","items","result","results","records","body"];

/* استخراج الأجسام الداخلية من أي شكل: [{json:{..}}] أو {data:[..]} أو {properties:[..]} أو كائن مفرد */
function extractRows(d){
  if (typeof d === "string"){ try { d = JSON.parse(d); } catch(e){ return []; } }
  if (d === null || d === undefined) return [];
  if (Array.isArray(d)) return d.flatMap(extractRows);
  if (typeof d !== "object") return [];
  if (d.json !== undefined && typeof d.json === "object") return extractRows(d.json);
  for (const k of WRAP_KEYS){
    if (d[k] !== undefined && d[k] !== null && typeof d[k] === "object") return extractRows(d[k]);
    if (typeof d[k] === "string" && /^\s*[\[{]/.test(d[k])) return extractRows(d[k]);
  }
  return [d];
}

async function fetchOnce(action){
  const data = await api({ action });
  console.log("list response (" + action + "):", data);
  const raw = extractRows(data);
  const list = Array.from(raw).map(normalize).filter(r => r.unit_code || r.unit_type || r.location || r.total_price);
  console.log("rows extracted (" + action + "):", list.length);
  return list;
}

async function fetchUnits(){
  /* المحاولة الأولى بـ properties، وإن فشلت أو رجعت فارغة نجرب get (القديم) */
  const actions = [CONFIG.LIST_ACTION, "get"].filter((a, i, arr) => a && arr.indexOf(a) === i);
  let list = [], lastErr = null;
  for (const act of actions){
    try { list = await fetchOnce(act); if (list.length) break; }
    catch(e){ lastErr = e; console.warn("list action failed:", act, e); }
  }
  if (!list.length && lastErr) throw lastErr;
  /* ترتيب تنازلي بآخر تحديث (الأحدث أولاً) مع ثبات الترتيب الأصلي عند التساوي */
  return list.map((r, i) => ({ r, i })).sort((a, b) => (ts(b.r.last_updated) - ts(a.r.last_updated)) || (a.i - b.i)).map(x => x.r);
}

async function loadUnits(){
  $("list").innerHTML = '<div class="ld">جارٍ تحميل الوحدات...</div>';
  try {
    rows = await fetchUnits();
    render();
    renderSub();
  } catch(e){
    console.error(e);
    $("stats").textContent = "";
    $("list").innerHTML = '<div class="empty" style="color:var(--bad)"><p><b>تعذر تحميل الوحدات</b></p><p dir="auto" style="margin:8px 0">' +
      esc(e && e.message ? e.message : e) + '</p><button class="btn" id="btnRetry" type="button">إعادة المحاولة</button></div>';
    $("btnRetry").onclick = loadUnits;
    toast("فشل التحميل", true);
  }
}
const load = loadUnits;

function render(){
  const q = $("q").value.trim().toLowerCase();
  const fs = $("fSec").value, ft = $("fSt").value;
  const list = rows.filter(r =>
    (!fs || r.section === fs) && (!ft || r.status === ft) &&
    (!q || [r.unit_code, r.location, r.unit_type, r.description].join(" ").toLowerCase().includes(q))
  );
  $("stats").textContent = "عدد الوحدات: " + list.length + " من " + rows.length;
  if (!list.length){ $("list").innerHTML = '<div class="empty">لا توجد وحدات مطابقة. اضغط "إضافة وحدة" لإضافة أول وحدة.</div>'; return; }
  $("list").innerHTML = '<div class="grid">' + list.map(r => {
    const imgs = splitImages(r.image_url);
    const bc = r.status === "تم البيع" ? "sold" : r.status === "مخفي" ? "hid" : "";
    const code = esc(r.unit_code);
    return '<article class="card"><div class="ph">' +
      (imgs[0] ? '<img loading="lazy" src="' + esc(imgs[0]) + '" alt="' + code + '">' : '<div class="noimg">لا توجد صورة</div>') +
      (r.status ? '<span class="badge ' + bc + '">' + esc(r.status) + '</span>' : '') +
      (imgs.length > 1 ? '<span class="cnt">' + imgs.length + ' صور</span>' : '') +
      '</div><div class="cb"><div class="code">' + code + (r.section ? ' | ' + esc(r.section) : '') + '</div>' +
      '<div class="price">' + esc(fmtPrice(r.total_price)) + '</div>' +
      '<div class="meta">' + esc([r.unit_type, r.location, r.area ? r.area + " م²" : "", r.rooms ? r.rooms + " غرف" : ""].filter(Boolean).join(" • ")) + '</div>' +
      (r.description ? '<div class="ds">' + esc(r.description) + '</div>' : '') +
      '</div><div class="acts" data-code="' + code + '">' +
      '<button class="btn sec" data-a="edit" type="button">تعديل</button>' +
      '<button class="btn sec" data-a="top" type="button">للأعلى</button>' +
      '<button class="btn bad" data-a="del" type="button">حذف</button></div></article>';
  }).join("") + '</div>';
}

/* تنظيف النصوص: إزالة الرموز الخفية (zero-width / RTL marks / BOM) وتحويل NBSP لمسافة عادية */
const HIDDEN = /[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g;
function clean(v){ return String(v ?? "").replace(HIDDEN, "").replace(/\u00A0/g, " ").trim(); }
function cleanImgs(v){ return String(v ?? "").split(/\r?\n/).map(clean).filter(Boolean).join("\n"); }

const BASE_KEYS = ["unit_code","section","unit_type","location","area","total_price","down_payment","installment","rooms","description","status","image_url"];

/* Payload للإضافة/التعديل: أسماء أعمدة دقيقة، وكل القيم نصوص (لا undefined) */
function fullPayload(action, o, oldCode){
  const p = { action };
  for (const k of BASE_KEYS){
    const v = k === "image_url" ? cleanImgs(o[k]) : clean(o[k]);
    p[k] = v;
    p[clean(FIELDS[k].ar)] = v;
  }
  if (oldCode !== undefined) p.old_unit_code = clean(oldCode);
  if (action === "add" || action === "update") p.send_notification = !!o.send_notification;
  if (action === "add" || action === "move_top"){
    p.last_updated = o.last_updated;
    p["آخر تحديث"] = o.last_updated;
  }
  return p;
}

function codePayload(action, code){
  const c = clean(code);
  return { action, unit_code: c, old_unit_code: c, "كود الوحدة": c };
}

/* ---------- مفتاح الأمان (admin_key) ---------- */
const KEY_STORE = "admin_key";
let keyMem = "";
function getKey(){ try { return localStorage.getItem(KEY_STORE) || keyMem; } catch(e){ return keyMem; } }
function setKey(v){ keyMem = v; try { localStorage.setItem(KEY_STORE, v); } catch(e){} }
function clearKey(){ keyMem = ""; try { localStorage.removeItem(KEY_STORE); } catch(e){} }

function askKey(){
  return new Promise(resolve => {
    const ov = $("kov"), inp = $("keyIn");
    inp.value = "";
    ov.classList.add("on");
    inp.focus();
    const done = v => { ov.classList.remove("on"); $("keyOk").onclick = $("keyCancel").onclick = inp.onkeydown = null; resolve(v); };
    $("keyOk").onclick = () => { const v = inp.value.trim(); if (v) done(v); };
    $("keyCancel").onclick = () => done("");
    inp.onkeydown = e => { if (e.key === "Enter"){ const v = inp.value.trim(); if (v) done(v); } };
  });
}

async function ensureKey(){
  let k = getKey();
  if (!k){ k = await askKey(); if (k) setKey(k); }
  return k;
}

function isAuthFail(d){
  return !!d && typeof d === "object" && !Array.isArray(d) &&
    (d.authorized === false || d.unauthorized === true || String(d.error || "").toLowerCase() === "unauthorized");
}

/* طلبات الإضافة والتعديل والحذف فقط: تُرفق admin_key تلقائياً */
async function secureApi(payload){
  const k = await ensureKey();
  if (!k) throw new Error("مفتاح الأمان مطلوب لتنفيذ هذه العملية");
  try {
    const d = await api(Object.assign({}, payload, { admin_key: k }));
    if (isAuthFail(d)){ const e = new Error("auth"); e.auth = true; throw e; }
    return d;
  } catch(e){
    if (e.auth || e.status === 401 || e.status === 403){
      clearKey();
      throw new Error("مفتاح الأمان غير صحيح. سيُطلب منك إدخاله من جديد عند المحاولة التالية.");
    }
    throw e;
  }
}

/* ---------- ويدجت الاشتراك ---------- */
let subData = null;

function parseSettings(d){
  const want = ["brand_id","plan_type","days_remaining","max_properties","subscription_date"];
  const out = {};
  for (const it of extractRows(d)){
    const k = it.key ?? it.setting ?? it.name ?? it["المفتاح"];
    const v = it.value ?? it["القيمة"];
    if (k !== undefined && want.includes(clean(k)) && v !== undefined) out[clean(k)] = v;
    for (const w of want) if (it[w] !== undefined && String(it[w]).trim() !== "") out[w] = it[w];
  }
  return out;
}

function fmtDate(v){
  if (v === undefined || v === null || String(v).trim() === "") return "-";
  const t = ts(v);
  if (!t) return String(v);
  return new Date(t).toLocaleDateString("ar-EG", { year: "numeric", month: "long", day: "numeric" });
}

function renderSub(){
  const s = subData;
  if (!s) return;
  const days = parseInt(String(s.days_remaining).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)), 10);
  const max = parseInt(String(s.max_properties).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)), 10);
  const cls = isNaN(days) ? "" : days <= 7 ? "d-bad" : days <= 30 ? "d-mid" : "d-ok";
  const used = rows.length;
  const pct = max > 0 ? Math.min(100, Math.round(used / max * 100)) : 0;
  $("sub").innerHTML = '<div class="sub">' +
    '<div class="it"><small>البراند</small><b>' + esc(s.brand_id || "-") + '</b></div>' +
    '<div class="it"><small>الباقة</small><span class="chip">' + esc(s.plan_type || "-") + '</span></div>' +
    '<div class="it"><small>الأيام المتبقية</small><b class="' + cls + '">' + (isNaN(days) ? esc(s.days_remaining || "-") : (days <= 0 ? "منتهي" : days + " يوم")) + '</b></div>' +
    '<div class="it"><small>العقارات</small><b>' + used + (max > 0 ? " / " + max : "") + '</b>' + (max > 0 ? '<div class="pb"><i style="width:' + pct + '%"></i></div>' : '') + '</div>' +
    '<div class="it"><small>تاريخ الاشتراك</small><b>' + esc(fmtDate(s.subscription_date)) + '</b></div></div>';
}

function applyBrand(){
  const b = subData && clean(subData.brand_id);
  if (!b) return;
  const t = b + " - " + CONFIG.TITLE_SUFFIX;
  $("appTitle").textContent = t;
  document.title = t;
}

async function loadSubscription(){
  try {
    const d = await secureApi({ action: CONFIG.SETTINGS_ACTION });
    console.log("settings:", d);
    subData = parseSettings(d);
    if (!Object.keys(subData).length) throw new Error("لم يتم العثور على حقول الاشتراك في الرد");
    applyBrand();
    renderSub();
  } catch(e){
    console.error(e);
    $("sub").innerHTML = '<div class="sub-err">تعذر تحميل بيانات الاشتراك: ' + esc(e.message) +
      ' <button class="btn sec" id="btnSubRetry" type="button" style="margin-inline-start:8px;padding:4px 12px">إعادة المحاولة</button></div>';
    $("btnSubRetry").onclick = loadSubscription;
  }
}

/* ---------- المودال ---------- */
function fillSelect(el, arr){ el.innerHTML = arr.map(v => '<option value="' + esc(v) + '">' + esc(v) + '</option>').join(""); }

function openModal(code){
  editing = code || null;
  const r = code ? rows.find(x => x.unit_code === code) : null;
  $("mTitle").textContent = r ? "تعديل الوحدة " + r.unit_code : "إضافة وحدة جديدة";
  for (const k in FIELDS){
    if (k === "image_url" || k === "last_updated") continue;
    $(k).value = r ? r[k] : "";
  }
  if (r){
    if (r.section && !SECTIONS.includes(r.section)) $("section").insertAdjacentHTML("beforeend", '<option value="' + esc(r.section) + '">' + esc(r.section) + '</option>');
    if (r.status && !STATUSES.includes(r.status)) $("status").insertAdjacentHTML("beforeend", '<option value="' + esc(r.status) + '">' + esc(r.status) + '</option>');
    $("section").value = r.section || SECTIONS[0];
    $("status").value = r.status || STATUSES[0];
  } else {
    fillSelect($("section"), SECTIONS);
    fillSelect($("status"), STATUSES);
  }
  album = r ? splitImages(r.image_url) : [];
  $("upSt").textContent = "";
  $("send_notification").checked = false;
  renderAlbum();
  $("ov").classList.add("on");
  $("unit_code").focus();
}

function closeModal(){ $("ov").classList.remove("on"); }

function renderAlbum(){
  $("album").innerHTML = album.map((u, i) =>
    '<div class="th' + (i === 0 ? ' hero' : '') + '" data-i="' + i + '"><img src="' + esc(u) + '" alt="صورة ' + (i + 1) + '">' +
    (i === 0 ? '<span class="hb">الرئيسية</span>' : '') +
    '<div class="tb">' + (i === 0 ? '' : '<button type="button" data-a="hero">رئيسية</button>') +
    '<button type="button" class="d" data-a="rm">حذف</button></div></div>'
  ).join("");
}

async function uploadOne(file){
  const fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", CONFIG.CLOUDINARY_PRESET);
  if (CONFIG.CLOUDINARY_FOLDER) fd.append("folder", CONFIG.CLOUDINARY_FOLDER);
  const res = await fetch("https://api.cloudinary.com/v1_1/" + CONFIG.CLOUDINARY_CLOUD_NAME + "/image/upload", { method: "POST", body: fd });
  const j = await res.json();
  if (!res.ok || !j.secure_url) throw new Error((j.error && j.error.message) || "فشل رفع الصورة");
  return fixImg(j.secure_url);
}

async function handleFiles(files){
  const list = Array.from(files);
  if (!list.length) return;
  let done = 0, failed = 0;
  uploading += list.length;
  $("btnSave").disabled = true;
  $("upSt").textContent = "جارٍ رفع 0 من " + list.length;
  for (const f of list){
    try { album.push(await uploadOne(f)); renderAlbum(); }
    catch(e){ failed++; toast(e.message, true); }
    done++; uploading--;
    $("upSt").textContent = "جارٍ رفع " + done + " من " + list.length;
  }
  $("upSt").textContent = failed ? "تم رفع " + (list.length - failed) + " وفشل " + failed : "تم رفع " + list.length + " صورة";
  if (!uploading) $("btnSave").disabled = false;
  $("files").value = "";
}

async function save(){
  const o = {};
  for (const k in FIELDS){ if (k !== "image_url" && k !== "last_updated") o[k] = $(k).value.trim(); }
  if (!o.unit_code){ toast("أدخل كود الوحدة", true); $("unit_code").focus(); return; }
  if (!editing && rows.some(r => r.unit_code === o.unit_code)){ toast("كود الوحدة مستخدم من قبل", true); return; }
  o.image_url = album.join("\n");
  o.send_notification = $("send_notification").checked;
  const old = editing ? rows.find(x => x.unit_code === editing) : null;
  if (old){
    /* عند التعديل: أي حقل ترك فارغاً يحتفظ بقيمته الحالية في الشيت (الصور تعكس الألبوم كما هو) */
    for (const k of BASE_KEYS){
      if (k === "image_url" || k === "unit_code") continue;
      if (clean(o[k]) === "" && clean(old[k]) !== "") o[k] = old[k];
    }
  } else {
    o.last_updated = Date.now();
  }
  $("btnSave").disabled = true;
  try {
    await secureApi(editing ? fullPayload("update", o, editing) : fullPayload("add", o));
    toast(editing ? "تم حفظ التعديلات" : "تمت إضافة الوحدة");
    closeModal();
    await load();
  } catch(e){ toast(e.message, true); }
  $("btnSave").disabled = !!uploading;
}

/* ---------- الأحداث ---------- */
$("btnAdd").onclick = () => openModal();
$("btnRefresh").onclick = () => { load(); loadSubscription(); };
$("btnCancel").onclick = closeModal;
$("btnSave").onclick = save;
$("btnPick").onclick = () => $("files").click();
$("files").onchange = e => handleFiles(e.target.files);
$("ov").addEventListener("click", e => { if (e.target === $("ov")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
["q","fSec","fSt"].forEach(id => $(id).addEventListener("input", render));

$("album").addEventListener("click", e => {
  const b = e.target.closest("button[data-a]");
  if (!b) return;
  const i = +b.closest(".th").dataset.i;
  if (b.dataset.a === "hero"){ const [u] = album.splice(i, 1); album.unshift(u); }
  else album.splice(i, 1);
  renderAlbum();
});

$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]");
  if (!b) return;
  const code = b.parentElement.dataset.code;
  const a = b.dataset.a;
  if (a === "edit") return openModal(code);
  if (a === "del"){
    if (!confirm("حذف الوحدة " + code + " نهائياً؟")) return;
    try { await secureApi(codePayload("delete", code)); toast("تم حذف الوحدة"); await load(); }
    catch(err){ toast(err.message, true); }
  }
  if (a === "top"){
    const r = rows.find(x => x.unit_code === code);
    if (!r){ toast("تعذر العثور على بيانات الوحدة، حدّث القائمة", true); return; }
    try {
      /* إرسال جميع بيانات العقار الحالية مع last_updated حتى لا تصل أي خانة undefined */
      const payload = fullPayload("move_top", Object.assign({}, r, { last_updated: Date.now() }), code);
      console.log("move_top payload (" + Object.keys(payload).length + " keys):\n" + JSON.stringify(payload, null, 2));
      await api(payload);
      toast("تم رفع الوحدة للأعلى"); await load();
    } catch(err){ toast(err.message, true); }
  }
});

fillSelect($("section"), SECTIONS);
fillSelect($("status"), STATUSES);
$("fSec").insertAdjacentHTML("beforeend", SECTIONS.map(v => '<option>' + v + '</option>').join(""));
$("fSt").insertAdjacentHTML("beforeend", STATUSES.map(v => '<option>' + v + '</option>').join(""));
load();
loadSubscription();
</script>
</body>
