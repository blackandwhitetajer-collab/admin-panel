<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة إدارة العقارات - Trust Estate</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #1e293b;
      --accent-color: #d97706;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success-color: #16a34a;
      --danger-color: #dc2626;
      --gray-color: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; }
    .container { max-width: 1250px; margin: 0 auto; }

    /* Header */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 18px 20px; border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .header h1 { font-size: 20px; color: var(--primary-color); display: flex; align-items: center; gap: 10px; }
    .header h1 i { color: var(--accent-color); }
    
    /* Buttons */
    .btn {
      padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px;
    }
    .btn-primary { background-color: var(--accent-color); color: #fff; }
    .btn-primary:hover { background-color: #b45309; }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-action { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-action:hover { background: #e2e8f0; }
    .btn-top { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .btn-top:hover { background: #bae6fd; }
    .btn-danger { background: #fee2e2; color: var(--danger-color); border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fca5a5; }

    /* Search Bar */
    .controls-bar { margin-bottom: 20px; }
    .search-box { position: relative; width: 100%; }
    .search-box input {
      width: 100%; padding: 12px 40px 12px 15px; border-radius: 8px;
      border: 1px solid var(--border-color); font-size: 14px; outline: none; background: #fff;
    }
    .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    /* Table & Cards Layout */
    .table-responsive {
      background: var(--card-bg); border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-color);
    }
    table { width: 100%; border-collapse: collapse; text-align: right; font-size: 14px; }
    th { background-color: #f8fafc; color: var(--text-muted); font-weight: 700; padding: 14px; border-bottom: 2px solid var(--border-color); white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    tr:hover { background-color: #f8fafc; }

    /* Property Thumbnail Image */
    .prop-thumb {
      width: 48px; height: 48px; border-radius: 8px; object-fit: cover;
      border: 1px solid var(--border-color); background-color: #f1f5f9;
    }
    .prop-code-cell { display: flex; align-items: center; gap: 10px; }

    /* Status Badges */
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; display: inline-block; white-space: nowrap; }
    .badge-available { background: #dcfce7; color: var(--success-color); }
    .badge-sold { background: #fee2e2; color: var(--danger-color); }
    .badge-hidden { background: #f1f5f9; color: var(--gray-color); }

    /* ---📱📱 MOBILE RESPONSIVE CARDS VIEW 📱📱--- */
    @media (max-width: 768px) {
      .table-responsive { background: transparent; border: none; box-shadow: none; overflow: visible; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; } /* Hide heavy headers on mobile */

      tr {
        background: var(--card-bg); border: 1px solid var(--border-color);
        border-radius: 14px; margin-bottom: 15px; padding: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      }

      td {
        display: flex; justify-content: space-between; align-items: center;
        padding: 8px 0; border-bottom: 1px dashed #f1f5f9; font-size: 14px;
      }
      td:last-child { border-bottom: none; margin-top: 10px; padding-top: 10px; }

      /* Insert column labels dynamically on mobile */
      td::before {
        content: attr(data-label);
        font-weight: 700; color: var(--text-muted); font-size: 13px;
      }

      .prop-code-cell { width: 100%; justify-content: space-between; }
      .mobile-actions { width: 100%; display: flex; gap: 8px; justify-content: flex-end; }
      .mobile-actions .btn { flex: 1; justify-content: center; }
    }

    /* Modals */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65);
      z-index: 1000; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(4px);
    }
    .modal-content {
      background: var(--card-bg); width: 100%; max-width: 720px; border-radius: 16px;
      padding: 25px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .modal-header h2 { font-size: 18px; color: var(--primary-color); }
    .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-muted); }

    /* Form Layout */
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full-width { grid-column: span 2; }
    .form-group label { font-size: 13px; font-weight: 600; color: var(--text-main); }
    .form-group input, .form-group select, .form-group textarea {
      padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--accent-color);
    }

    /* Image Preview Box inside Modal */
    .image-preview-wrapper {
      margin-top: 8px; padding: 10px; border: 1px dashed var(--border-color);
      border-radius: 8px; text-align: center; background: #f8fafc;
    }
    .image-preview-wrapper img {
      max-width: 100%; max-height: 160px; border-radius: 6px; object-fit: cover; display: none;
    }
    .image-preview-placeholder { font-size: 12px; color: var(--text-muted); }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full-width { grid-column: span 1; }
    }

    .empty-state { text-align: center; padding: 30px; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1><i class="fa-solid fa-city"></i> لوحة إدارة عقارات Trust Estate</h1>
      <button class="btn btn-primary" onclick="openModal('add')">
        <i class="fa-solid fa-plus"></i> إضافة عقار جديد
      </button>
    </div>

    <!-- Search Controls -->
    <div class="controls-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="ابحث برقم الكود، المنطقة، أو نوع العقار...">
      </div>
    </div>

    <!-- Table / Responsive Cards -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>كود الوحدة</th>
            <th>النوع</th>
            <th>المنطقة</th>
            <th>المساحة</th>
            <th>السعر الإجمالي</th>
            <th>المقدم</th>
            <th>الحالة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="propertiesTableBody">
          <tr>
            <td colspan="8" class="empty-state">جاري جلب بيانات العقارات...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal (Add / Edit) -->
  <div class="modal" id="propertyModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">إضافة عقار جديد</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <form id="propertyForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="formAction" value="add">

        <div class="form-grid">
          <div class="form-group">
            <label>كود الوحدة *</label>
            <input type="text" id="unit_code" required placeholder="مثال: TE_101">
          </div>

          <div class="form-group">
            <label>القسم *</label>
            <select id="section" required>
              <option value="سكني">سكني</option>
              <option value="تجاري">تجاري</option>
              <option value="إداري">إداري</option>
              <option value="أراضي">أراضي</option>
            </select>
          </div>

          <div class="form-group">
            <label>نوع الوحدة *</label>
            <input type="text" id="unit_type" required placeholder="شقة للبيع، فيلا، محل...">
          </div>

          <div class="form-group">
            <label>المنطقة / الموقع *</label>
            <input type="text" id="location" required placeholder="حي الأشجار، الشيخ زايد...">
          </div>

          <div class="form-group">
            <label>المساحة (م²) *</label>
            <input type="text" id="area" required placeholder="135">
          </div>

          <div class="form-group">
            <label>السعر الإجمالي (ج.م) *</label>
            <input type="text" id="total_price" required oninput="formatPriceInput(this)" placeholder="مثال: 2,500,000">
          </div>

          <div class="form-group">
            <label>المقدم (ج.م)</label>
            <input type="text" id="down_payment" oninput="formatPriceInput(this)" placeholder="مثال: كاش أو 250,000">
          </div>

          <div class="form-group">
            <label>نظام التقسيط</label>
            <input type="text" id="installment" placeholder="على 5 سنوات">
          </div>

          <div class="form-group">
            <label>عدد الغرف</label>
            <input type="text" id="rooms" placeholder="3">
          </div>

          <div class="form-group">
            <label>حالة العقار *</label>
            <select id="property_status" required>
              <option value="متاح" selected>متاح 🟢</option>
              <option value="تم البيع">تم البيع 🔴</option>
              <option value="مخفي">مخفي 👁️‍🗨️</option>
            </select>
          </div>

          <!-- Image URL & Live Preview -->
          <div class="form-group full-width">
            <label>رابط الصورة الرئيسية *</label>
            <input type="url" id="image_url" oninput="previewModalImage(this.value)" placeholder="https://res.cloudinary.com/...">
            
            <div class="image-preview-wrapper">
              <span id="previewPlaceholder" class="image-preview-placeholder">ادخلي رابط الصورة لمشاهدة المعاينة هنا</span>
              <img id="modalImgPreview" src="" alt="معاينة الصورة الرئيسية">
            </div>
          </div>

          <div class="form-group full-width">
            <label>الوصف التسويقي</label>
            <textarea id="description" rows="3" placeholder="تفاصيل الوصف والتشطيب..."></textarea>
          </div>
        </div>

        <div style="margin-top: 20px; text-align: left; display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn btn-action" onclick="closeModal()">إلغاء</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">حفظ البيانات</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 🔗 رابط Webhook الخاص بكِ
    const WEBHOOK_URL = "https://n8n.hellolucidagency.com/webhook/properties";

    let propertiesData = [];

    // --- Helper to handle key name variations from Sheet ---
    function getVal(item, keys) {
      for (let k of keys) {
        if (item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== "") {
          return item[k];
        }
      }
      return "";
    }

    // --- Price Formatter Fix ---
    function formatPrice(value) {
      if (!value || String(value).trim() === "") return "-";
      const strVal = String(value).trim();
      const cleanNum = strVal.replace(/[^\d]/g, "");
      
      // If it's pure text like "كاش"
      if (!cleanNum) return strVal;
      
      const num = parseInt(cleanNum, 10);
      if (isNaN(num)) return strVal;
      
      return new Intl.NumberFormat('ar-EG').format(num) + " ج.م";
    }

    function formatPriceInput(input) {
      let raw = input.value.replace(/[^\d]/g, "");
      if (raw) {
        input.value = new Intl.NumberFormat('en-US').format(parseInt(raw, 10));
      } else {
        // Keep text if entered manually
      }
    }

    // --- Image Preview Handler inside Modal ---
    function previewModalImage(url) {
      const img = document.getElementById("modalImgPreview");
      const placeholder = document.getElementById("previewPlaceholder");
      if (url && url.trim().startsWith("http")) {
        img.src = url.trim();
        img.style.display = "inline-block";
        placeholder.style.display = "none";
      } else {
        img.src = "";
        img.style.display = "none";
        placeholder.style.display = "inline-block";
      }
    }

    // --- Initialize ---
    document.addEventListener("DOMContentLoaded", () => {
      fetchProperties();
    });

    // --- Fetch Data ---
    async function fetchProperties() {
      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "get" })
        });
        const data = await response.json();
        propertiesData = Array.isArray(data) ? data : (data.data || []);
        renderTable(propertiesData);
      } catch (err) {
        console.error("Error fetching data:", err);
        document.getElementById("propertiesTableBody").innerHTML = `
          <tr><td colspan="8" class="empty-state">تعذر جلب البيانات. تحققي من شبكة النت ورابط Webhook.</td></tr>`;
      }
    }

    // --- Render Table & Responsive Cards ---
    function renderTable(data) {
      const tbody = document.getElementById("propertiesTableBody");
      tbody.innerHTML = "";

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty-state">لا توجد عقارات مسجلة حالياً.</td></tr>`;
        return;
      }

      data.forEach(item => {
        const unitCode = getVal(item, ["كود الوحدة", "unit_code", "code"]) || "-";
        const unitType = getVal(item, ["نوع الوحدة", "unit_type", "type"]) || "-";
        const location = getVal(item, ["المنطقة", "location"]) || "-";
        const area = getVal(item, ["المساحة", "area"]) || "-";
        
        // Flexibly fetch price regardless of Hamza
        const totalPrice = getVal(item, ["السعر الإجمالي", "السعر الاجمالي", "السعر", "total_price"]);
        const downPayment = getVal(item, ["المقدم", "مقدم", "down_payment"]);
        
        const status = getVal(item, ["حالة العقار", "status"]) || "متاح";
        const imageUrl = getVal(item, ["رابط الصور", "image_url", "image"]) || "https://via.placeholder.com/100?text=عقار";

        let badgeClass = "badge-available";
        if (status === "تم البيع") badgeClass = "badge-sold";
        if (status === "مخفي") badgeClass = "badge-hidden";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td data-label="كود الوحدة">
            <div class="prop-code-cell">
              <img src="${imageUrl}" class="prop-thumb" onerror="this.src='https://via.placeholder.com/100?text=عقار'">
              <strong>${unitCode}</strong>
            </div>
          </td>
          <td data-label="النوع">${unitType}</td>
          <td data-label="المنطقة">${location}</td>
          <td data-label="المساحة">${area} م²</td>
          <td data-label="السعر الإجمالي"><strong>${formatPrice(totalPrice)}</strong></td>
          <td data-label="المقدم">${formatPrice(downPayment)}</td>
          <td data-label="الحالة"><span class="badge ${badgeClass}">${status}</span></td>
          <td data-label="الإجراءات">
            <div class="mobile-actions">
              <button class="btn btn-sm btn-top" title="رفع للأعلى" onclick="moveToTop('${unitCode}')">
                <i class="fa-solid fa-arrow-up"></i> رفع
              </button>
              <button class="btn btn-sm btn-action" title="تعديل" onclick="editProperty('${unitCode}')">
                <i class="fa-solid fa-pen"></i> تعديل
              </button>
              <button class="btn btn-sm btn-danger" title="حذف" onclick="deleteProperty('${unitCode}')">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // --- Move To Top ---
    async function moveToTop(unitCode) {
      if (!confirm(`هل تريد رفع العقار (${unitCode}) لأعلى القائمة؟`)) return;

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "move_top", unit_code: unitCode })
        });

        if (response.ok) {
          alert("تم رفع العقار لأعلى القائمة بنجاح! 🚀");
          fetchProperties();
        }
      } catch (err) {
        console.error("Error moving to top:", err);
      }
    }

    // --- Delete Property ---
    async function deleteProperty(unitCode) {
      if (!confirm(`هل أنت متأكد من حذف العقار كود (${unitCode})؟`)) return;

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "delete", unit_code: unitCode })
        });

        if (response.ok) {
          alert("تم حذف العقار.");
          fetchProperties();
        }
      } catch (err) {
        console.error("Error deleting:", err);
      }
    }

    // --- Open Modal (Add / Edit) ---
    function openModal(mode, data = null) {
      document.getElementById("propertyForm").reset();
      document.getElementById("formAction").value = mode;

      if (mode === "add") {
        document.getElementById("modalTitle").innerText = "إضافة عقار جديد";
        document.getElementById("unit_code").disabled = false;
        previewModalImage("");
      } else if (mode === "edit" && data) {
        document.getElementById("modalTitle").innerText = "تعديل بيانات العقار";
        
        const unitCode = getVal(data, ["كود الوحدة", "unit_code"]);
        document.getElementById("unit_code").value = unitCode;
        document.getElementById("unit_code").disabled = true;

        document.getElementById("section").value = getVal(data, ["القسم", "section"]) || "سكني";
        document.getElementById("unit_type").value = getVal(data, ["نوع الوحدة", "unit_type"]);
        document.getElementById("location").value = getVal(data, ["المنطقة", "location"]);
        document.getElementById("area").value = getVal(data, ["المساحة", "area"]);
        
        document.getElementById("total_price").value = getVal(data, ["السعر الإجمالي", "السعر الاجمالي", "السعر"]);
        document.getElementById("down_payment").value = getVal(data, ["المقدم", "مقدم"]);

        document.getElementById("installment").value = getVal(data, ["نظام التقسيط", "installment"]);
        document.getElementById("rooms").value = getVal(data, ["عدد الغرف", "rooms"]);
        document.getElementById("property_status").value = getVal(data, ["حالة العقار", "status"]) || "متاح";
        
        const imgUrl = getVal(data, ["رابط الصور", "image_url"]);
        document.getElementById("image_url").value = imgUrl;
        previewModalImage(imgUrl); // 👈 تشغيل المعاينة الفورية للصورة

        document.getElementById("description").value = getVal(data, ["الوصف التسويقي", "description"]);
      }

      document.getElementById("propertyModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("propertyModal").style.display = "none";
    }

    function editProperty(unitCode) {
      const item = propertiesData.find(p => getVal(p, ["كود الوحدة", "unit_code"]) === unitCode);
      if (item) openModal("edit", item);
    }

    // --- Form Submit ---
    async function handleFormSubmit(e) {
      e.preventDefault();
      const action = document.getElementById("formAction").value;

      const payload = {
        action: action,
        unit_code: document.getElementById("unit_code").value,
        section: document.getElementById("section").value,
        unit_type: document.getElementById("unit_type").value,
        location: document.getElementById("location").value,
        area: document.getElementById("area").value,
        total_price: document.getElementById("total_price").value.replace(/[^\d]/g, ""),
        down_payment: document.getElementById("down_payment").value,
        installment: document.getElementById("installment").value,
        rooms: document.getElementById("rooms").value,
        status: document.getElementById("property_status").value,
        image_url: document.getElementById("image_url").value,
        description: document.getElementById("description").value
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert(action === "add" ? "تمت إضافة العقار بنجاح! 🎉" : "تم تعديل البيانات والصورة بنجاح! ✨");
          closeModal();
          fetchProperties();
        } else {
          alert("حدث خطأ في الحفظ.");
        }
      } catch (err) {
        console.error("Error submitting form:", err);
      }
    }

    // --- Filter ---
    function filterTable() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = propertiesData.filter(item => {
        const code = getVal(item, ["كود الوحدة", "unit_code"]).toLowerCase();
        const loc = getVal(item, ["المنطقة", "location"]).toLowerCase();
        const type = getVal(item, ["نوع الوحدة", "unit_type"]).toLowerCase();
        return code.includes(query) || loc.includes(query) || type.includes(query);
      });
      renderTable(filtered);
    }
  </script>
</body>
</html>
