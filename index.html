<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة العقارات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .login-card { max-width: 400px; margin: 80px auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .card { border-radius: 12px; border: none; transition: transform 0.2s; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .property-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .card-img-container { position: relative; height: 180px; overflow: hidden; border-radius: 12px 12px 0 0; background: #e9ecef; }
        .card-img-top { width: 100%; height: 100%; object-fit: cover; }
        .img-badge { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
        .code-badge { position: absolute; top: 10px; left: 10px; background: #0d6efd; color: #fff; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.8rem; }
        .gallery-thumb { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; }
        .gallery-thumb:hover { border-color: #0d6efd; transform: scale(1.03); }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-section" class="container">
        <div class="card login-card p-4">
            <h4 class="text-center mb-4"><i class="fa-solid fa-lock text-primary me-2"></i>تسجيل الدخول</h4>
            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input type="password" id="password-input" class="form-control" placeholder="أدخل كلمة المرور">
            </div>
            <button onclick="login()" class="btn btn-primary w-100 mb-2">دخول</button>
            <div id="login-error" class="text-danger small text-center d-none">كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-section" class="container py-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
            <h4 class="m-0 text-primary"><i class="fa-solid fa-building me-2"></i>قائمة الوحدات العقارية</h4>
            <div>
                <button onclick="fetchProperties()" class="btn btn-outline-secondary btn-sm me-2"><i class="fa-solid fa-rotate me-1"></i>تحديث</button>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-right-from-bracket me-1"></i>خروج</button>
            </div>
        </div>

        <!-- مؤشر التحميل -->
        <div id="loading-spinner" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">جاري تحميل الوحدات العقارية...</p>
        </div>

        <!-- شبكة كروت العقارات -->
        <div class="row g-4 d-none" id="properties-grid"></div>

        <div id="empty-msg" class="text-center py-5 d-none text-muted">لا توجد عقارات مسجلة حالياً.</div>
        <div id="error-msg" class="text-center py-5 text-danger d-none">حدث خطأ أثناء تحميل البيانات من السيرفر!</div>
    </div>

    <!-- نافذة تفاصيل وتعديل العقار (Modal) -->
    <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-light">
                    <h5 class="modal-title" id="modalTitle">تفاصيل العقار</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- معرض جميع الصور -->
                    <h6 class="fw-bold mb-3"><i class="fa-solid fa-images text-primary me-2"></i>معرض الصور الكامل:</h6>
                    <div class="row g-2 mb-4" id="modalGallery"></div>

                    <hr>

                    <!-- خانات بيانات العقار -->
                    <h6 class="fw-bold mb-3"><i class="fa-solid fa-sliders text-primary me-2"></i>بيانات العقار الأساسية:</h6>
                    <form id="editForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small text-muted">كود الوحدة</label>
                                <input type="text" class="form-control" id="modalCode" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">المنطقة / الحي</label>
                                <input type="text" class="form-control" id="modalRegion">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">نوع الوحدة والقسم</label>
                                <input type="text" class="form-control" id="modalType">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">المساحة</label>
                                <input type="text" class="form-control" id="modalArea">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">السعر الإجمالي</label>
                                <input type="text" class="form-control" id="modalPrice">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">المقدم</label>
                                <input type="text" class="form-control" id="modalDownPayment">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">نظام التقسيط</label>
                                <input type="text" class="form-control" id="modalInstallment">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted">عدد الغرف</label>
                                <input type="text" class="form-control" id="modalRooms">
                            </div>
                            <div class="col-12">
                                <label class="form-label small text-muted">الوصف التسويقي</label>
                                <textarea class="form-control" id="modalDesc" rows="4"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
                    <button type="button" class="btn btn-primary" onclick="alert('سندعم حفظ التعديلات والحذف في الخطوة التالية!')"><i class="fa-solid fa-floppy-disk me-1"></i>حفظ التعديلات</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const WEBHOOK_URL = 'https://n8n.hellolucidagency.com/webhook/properties';
        const PASS_CODE = 'Client@2026';
        let propertiesData = [];
        let detailsModalInstance;

        window.onload = function() {
            detailsModalInstance = new bootstrap.Modal(document.getElementById('detailsModal'));
            if (sessionStorage.getItem('admin_logged') === 'true') {
                showAdmin();
            }
        };

        function login() {
            const pass = document.getElementById('password-input').value;
            if (pass === PASS_CODE) {
                sessionStorage.setItem('admin_logged', 'true');
                document.getElementById('login-error').classList.add('d-none');
                showAdmin();
            } else {
                document.getElementById('login-error').classList.remove('d-none');
            }
        }

        function logout() {
            sessionStorage.removeItem('admin_logged');
            document.getElementById('admin-section').classList.add('d-none');
            document.getElementById('login-section').classList.remove('d-none');
        }

        function showAdmin() {
            document.getElementById('login-section').classList.add('d-none');
            document.getElementById('admin-section').classList.remove('d-none');
            fetchProperties();
        }

        // دالة ذكية للبحث عن قيمة الحقل بغض النظر عن المسافات أو الهمزات
        function getValue(row, possibleKeys) {
            if (!row) return '';
            const rowKeys = Object.keys(row);

            // 1. مطابقة مباشرة أولاً
            for (let key of possibleKeys) {
                if (row[key] !== undefined && row[key] !== null && String(row[key]).trim() !== '') {
                    return String(row[key]).trim();
                }
            }

            // 2. مطابقة مرنة (تجاهل الهمزات والمسافات)
            for (let rKey of rowKeys) {
                const cleanRKey = rKey.replace(/[\u0622\u0623\u0625]/g, 'ا').replace(/\s+/g, '').toLowerCase();
                for (let pKey of possibleKeys) {
                    const cleanPKey = pKey.replace(/[\u0622\u0623\u0625]/g, 'ا').replace(/\s+/g, '').toLowerCase();
                    if (cleanRKey === cleanPKey || cleanRKey.includes(cleanPKey)) {
                        if (row[rKey] !== undefined && row[rKey] !== null && String(row[rKey]).trim() !== '') {
                            return String(row[rKey]).trim();
                        }
                    }
                }
            }
            return '';
        }

        async function fetchProperties() {
            document.getElementById('loading-spinner').classList.remove('d-none');
            document.getElementById('properties-grid').classList.add('d-none');
            document.getElementById('error-msg').classList.add('d-none');
            document.getElementById('empty-msg').classList.add('d-none');

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get' })
                });

                if (!response.ok) throw new Error('فشل الاتصال');

                const data = await response.json();
                document.getElementById('loading-spinner').classList.add('d-none');

                let items = Array.isArray(data) ? data : [data];
                propertiesData = items.map(item => item.json || item);

                if (propertiesData.length === 0) {
                    document.getElementById('empty-msg').classList.remove('d-none');
                    return;
                }

                renderCards(propertiesData);
            } catch (err) {
                console.error(err);
                document.getElementById('loading-spinner').classList.add('d-none');
                document.getElementById('error-msg').classList.remove('d-none');
            }
        }

        function renderCards(rows) {
            const grid = document.getElementById('properties-grid');
            grid.innerHTML = '';

            rows.forEach((row, index) => {
                const code = getValue(row, ['كود الوحدة', 'كود']) || `وحدة #${index + 1}`;
                const type = getValue(row, ['نوع الوحدة', 'القسم']) || 'عقار';
                const region = getValue(row, ['المنطقة', 'المنطقه', 'حي', 'الحي']) || 'غير محدد';
                const price = getValue(row, ['السعر الإجمالي', 'السعر الاجمالي', 'السعر', 'سعر']) || 'حسب الطلب';

                const rawImgs = getValue(row, ['رابط الصور', 'الصور', 'صور']);
                const imgList = rawImgs ? rawImgs.split(',').map(s => s.trim()).filter(Boolean) : [];
                const heroImg = imgList.length > 0 ? imgList[0] : 'https://via.placeholder.com/400x250?text=No+Image';

                const col = document.createElement('div');
                col.className = 'col-12 col-md-6 col-lg-4';
                col.innerHTML = `
                    <div class="card h-100 property-card">
                        <div class="card-img-container">
                            <img src="${heroImg}" class="card-img-top" alt="صورة العقار">
                            <span class="code-badge">${code}</span>
                            <span class="img-badge"><i class="fa-solid fa-camera me-1"></i>${imgList.length} صور</span>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title mb-1 text-truncate">${type}</h5>
                            <p class="text-muted small mb-2"><i class="fa-solid fa-location-dot me-1 text-danger"></i>${region}</p>
                            <h6 class="text-success fw-bold mb-3">${price} ${price !== 'حسب الطلب' ? 'جنية' : ''}</h6>
                            
                            <div class="d-flex gap-2">
                                <button onclick="openDetailsModal(${index})" class="btn btn-outline-primary btn-sm w-100">
                                    <i class="fa-solid fa-pen-to-square me-1"></i>تعديل والتفاصيل
                                </button>
                                <button onclick="alert('سندعم الحذف في الخطوة التالية!')" class="btn btn-outline-danger btn-sm">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });

            grid.classList.remove('d-none');
        }

        function openDetailsModal(index) {
            const item = propertiesData[index];
            if (!item) return;

            const code = getValue(item, ['كود الوحدة', 'كود']);
            document.getElementById('modalTitle').innerText = `تفاصيل وتعديل العقار: ${code}`;

            // ملء المعرض بالصور
            const rawImgs = getValue(item, ['رابط الصور', 'الصور', 'صور']);
            const imgList = rawImgs ? rawImgs.split(',').map(s => s.trim()).filter(Boolean) : [];
            const galleryContainer = document.getElementById('modalGallery');
            galleryContainer.innerHTML = '';

            if (imgList.length === 0) {
                galleryContainer.innerHTML = '<div class="col-12 text-muted small">لا توجد صور لهذه الوحدة.</div>';
            } else {
                imgList.forEach(img => {
                    const imgCol = document.createElement('div');
                    imgCol.className = 'col-4 col-sm-3';
                    imgCol.innerHTML = `<a href="${img}" target="_blank"><img src="${img}" class="gallery-thumb" title="اضغط لفتح الصورة بحجم كامل"></a>`;
                    galleryContainer.appendChild(imgCol);
                });
            }

            // ملء باقي الخانات بالدالة الذكية
            document.getElementById('modalCode').value = getValue(item, ['كود الوحدة', 'كود']);
            document.getElementById('modalRegion').value = getValue(item, ['المنطقة', 'المنطقه', 'حي', 'الحي']);
            document.getElementById('modalType').value = getValue(item, ['نوع الوحدة', 'القسم']);
            document.getElementById('modalArea').value = getValue(item, ['المساحة', 'المساحه']);
            document.getElementById('modalPrice').value = getValue(item, ['السعر الإجمالي', 'السعر الاجمالي', 'السعر', 'سعر']);
            document.getElementById('modalDownPayment').value = getValue(item, ['المقدم', 'مقدم']);
            document.getElementById('modalInstallment').value = getValue(item, ['نظام التقسيط', 'التقسيط']);
            document.getElementById('modalRooms').value = getValue(item, ['عدد الغرف', 'الغرف']);
            document.getElementById('modalDesc').value = getValue(item, ['الوصف التسويقي', 'الوصف']);

            detailsModalInstance.show();
        }
    </script>
</body>
</html>
