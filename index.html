<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة العقارات - تراست</title>
    <style>
        :root {
            --primary-color: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        /* شبكة الكروت */
        .properties-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .property-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .badge-code {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(29, 78, 216, 0.9);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            z-index: 2;
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #e5e7eb;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .images-count-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.2rem;
            margin: 0 0 8px 0;
            color: #111827;
        }

        .card-location {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .card-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: #059669;
            margin-bottom: 15px;
        }

        .card-actions {
            padding: 12px 15px;
            border-top: 1px solid #f3f4f6;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-edit {
            background-color: #eff6ff;
            color: var(--primary-color);
            flex-grow: 1;
            border: 1px solid #bfdbfe;
        }

        .btn-edit:hover {
            background-color: #dbeafe;
        }

        /* النافذة المنبثقة (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 750px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group.full-width { grid-column: span 2; }

        label { font-size: 0.85rem; font-weight: bold; color: #374151; }
        input, textarea, select {
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        /* معرض الصور المتفاعل داخل Modal التعديل */
        .edit-images-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            padding: 10px;
            background: #f9fafb;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            min-height: 100px;
        }

        .img-preview-card {
            position: relative;
            width: 100px;
            height: 110px;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            background: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .img-preview-card.main-img {
            border: 2px solid #059669;
        }

        .img-preview-card img {
            width: 100%;
            height: 70px;
            object-fit: cover;
        }

        .main-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #059669;
            color: #fff;
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .img-controls {
            display: flex;
            justify-content: space-between;
            padding: 4px;
            background: #fff;
        }

        .btn-mini {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 6px;
        }

        .btn-mini:hover { background: #e5e7eb; }
        .btn-mini.delete { color: #dc2626; }
    </style>
</head>
<body>

    <div class="header">
        <h1>لوحة إدارة العقارات</h1>
        <p>إدارة وتحديث بيانات العقارات مباشرة في Google Sheets</p>
    </div>

    <div id="propertiesGrid" class="properties-grid">
        <!-- يتم تحميل كروت العقارات هنا عبر JavaScript -->
    </div>

    <!-- نافذة التعديل Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0;">تعديل بيانات العقار</h2>
            <form id="editForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>كود الوحدة (غير قابل للتعديل):</label>
                        <input type="text" id="editCode" readonly style="background:#f3f4f6;">
                    </div>
                    <div class="form-group">
                        <label>القسم:</label>
                        <input type="text" id="editSection">
                    </div>
                    <div class="form-group">
                        <label>نوع الوحدة:</label>
                        <input type="text" id="editType">
                    </div>
                    <div class="form-group">
                        <label>المنطقة / الحي:</label>
                        <input type="text" id="editRegion">
                    </div>
                    <div class="form-group">
                        <label>المساحة:</label>
                        <input type="text" id="editArea">
                    </div>
                    <div class="form-group">
                        <label>السعر الإجمالي:</label>
                        <input type="text" id="editPrice">
                    </div>
                    <div class="form-group">
                        <label>المقدم:</label>
                        <input type="text" id="editDownPayment">
                    </div>
                    <div class="form-group">
                        <label>نظام التقسيط:</label>
                        <input type="text" id="editInstallment">
                    </div>
                    <div class="form-group">
                        <label>عدد الغرف:</label>
                        <input type="text" id="editRooms">
                    </div>
                    <div class="form-group full-width">
                        <label>الوصف التسويقي:</label>
                        <textarea id="editDesc" rows="3"></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label>ترتيب ومعرض الصور (الصورة الأولى هي الرئيسية):</label>
                        <div id="editImagesContainer" class="edit-images-container">
                            <!-- معاينة الصور والتعديل عليها -->
                        </div>
                    </div>
                </div>

                <div style="margin-top:20px; display:flex; gap:10px; justify-content:flex-end;">
                    <button type="button" class="btn" style="background:#e5e7eb;" onclick="closeModal()">إلغاء</button>
                    <button type="button" id="saveModalBtn" class="btn" style="background:var(--primary-color); color:#fff;" onclick="submitUpdate()">حفظ التعديلات</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const N8N_WEBHOOK_URL = 'https://n8n.hellolucidagency.com/webhook/properties';

        let allProperties = [];
        let currentEditingImages = [];

        // 1️⃣ دالة معالجة روابط الصور الذكية (لحل مشكلة Cloudinary و .heic)
        function formatImageUrl(url) {
            if (!url) return 'https://via.placeholder.com/400x300?text=No+Image';
            let cleanUrl = url.trim();
            // تحويل صيغة HEIC المرفوعة من الآيفون إلى JPG لتعرض على المتصفح
            if (cleanUrl.toLowerCase().endsWith('.heic')) {
                cleanUrl = cleanUrl.replace(/\.heic$/i, '.jpg');
            }
            return cleanUrl;
        }

        // 2️⃣ تقسيم سلسلة روابط الصور إلى مصفوفة
        function parseImages(imagesString) {
            if (!imagesString) return [];
            return imagesString.split(',')
                .map(img => img.trim())
                .filter(img => img.length > 0);
        }

        // 3️⃣ جلب العقارات من n8n
        async function fetchProperties() {
            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "get" })
                });
                const data = await response.json();
                allProperties = Array.isArray(data) ? data : (data.data || []);
                renderPropertiesGrid(allProperties);
            } catch (err) {
                console.error('خطأ في جلب البيانات:', err);
            }
        }

        // 4️⃣ عرض كروت العقارات
        function renderPropertiesGrid(properties) {
            const grid = document.getElementById('propertiesGrid');
            grid.innerHTML = '';

            properties.forEach(item => {
                const rawImages = item['رابط الصور'] || '';
                const imagesList = parseImages(rawImages);
                const mainImage = imagesList.length > 0 ? formatImageUrl(imagesList[0]) : 'https://via.placeholder.com/400x300?text=No+Image';

                const card = document.createElement('div');
                card.className = 'property-card';
                card.innerHTML = `
                    <span class="badge-code">${item['كود الوحدة'] || 'N/A'}</span>
                    <div class="card-image-wrapper">
                        <img src="${mainImage}" class="card-image" alt="صورة العقار" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Error'">
                        <span class="images-count-badge">📷 ${imagesList.length} صور</span>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${item['نوع الوحدة'] || ''} - ${item['القسم'] || ''}</h3>
                        <div class="card-location">📍 ${item['المنطقة'] || 'غير محدد'}</div>
                        <div class="card-price">${item['السعر الإجمالي'] || 'غير معلن'}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-edit" onclick="openEditModal('${item['كود الوحدة']}')">📝 تعديل والتفاصيل</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 5️⃣ فتح نافذة التعديل وتعبئة البيانات
        function openEditModal(code) {
            const unit = allProperties.find(p => p['كود الوحدة'] === code);
            if (!unit) return;

            document.getElementById('editCode').value = unit['كود الوحدة'] || '';
            document.getElementById('editSection').value = unit['القسم'] || '';
            document.getElementById('editType').value = unit['نوع الوحدة'] || '';
            document.getElementById('editRegion').value = unit['المنطقة'] || '';
            document.getElementById('editArea').value = unit['المساحة'] || '';
            document.getElementById('editPrice').value = unit['السعر الإجمالي'] || '';
            document.getElementById('editDownPayment').value = unit['المقدم'] || '';
            document.getElementById('editInstallment').value = unit['نظام التقسيط'] || '';
            document.getElementById('editRooms').value = unit['عدد الغرف'] || '';
            document.getElementById('editDesc').value = unit['الوصف التسويقي'] || '';

            // تحميل الصور للترتيب والتعديل
            currentEditingImages = parseImages(unit['رابط الصور'] || '');
            renderEditImagesUI();

            document.getElementById('editModal').classList.add('active');
        }

        // 6️⃣ عرض وترتيب الصور داخل Modal التعديل
        function renderEditImagesUI() {
            const container = document.getElementById('editImagesContainer');
            container.innerHTML = '';

            if (currentEditingImages.length === 0) {
                container.innerHTML = '<span style="color:#9ca3af; font-size:0.9rem;">لا توجد صور لهذه الوحدة</span>';
                return;
            }

            currentEditingImages.forEach((imgUrl, index) => {
                const isMain = index === 0;
                const card = document.createElement('div');
                card.className = `img-preview-card ${isMain ? 'main-img' : ''}`;
                card.innerHTML = `
                    ${isMain ? '<span class="main-badge">رئيسية</span>' : ''}
                    <img src="${formatImageUrl(imgUrl)}" alt="صورة">
                    <div class="img-controls">
                        ${index > 0 ? `<button type="button" class="btn-mini" onclick="moveImage(${index}, -1)" title="تقديم">➡️</button>` : '<span></span>'}
                        <button type="button" class="btn-mini delete" onclick="removeImage(${index})" title="حذف">🗑️</button>
                        ${index < currentEditingImages.length - 1 ? `<button type="button" class="btn-mini" onclick="moveImage(${index}, 1)" title="تأخير">⬅️</button>` : '<span></span>'}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function moveImage(index, direction) {
            const targetIndex = index + direction;
            if (targetIndex >= 0 && targetIndex < currentEditingImages.length) {
                const temp = currentEditingImages[index];
                currentEditingImages[index] = currentEditingImages[targetIndex];
                currentEditingImages[targetIndex] = temp;
                renderEditImagesUI();
            }
        }

        function removeImage(index) {
            currentEditingImages.splice(index, 1);
            renderEditImagesUI();
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        // 7️⃣ إرسال التعديلات لـ n8n
        async function submitUpdate() {
            const saveBtn = document.getElementById('saveModalBtn');
            saveBtn.innerText = 'جاري الحفظ...';
            saveBtn.disabled = true;

            const updatedPayload = {
                action: "update",
                "كود الوحدة": document.getElementById('editCode').value,
                "القسم": document.getElementById('editSection').value,
                "نوع الوحدة": document.getElementById('editType').value,
                "المنطقة": document.getElementById('editRegion').value,
                "المساحة": document.getElementById('editArea').value,
                "السعر الإجمالي": document.getElementById('editPrice').value,
                "المقدم": document.getElementById('editDownPayment').value,
                "نظام التقسيط": document.getElementById('editInstallment').value,
                "عدد الغرف": document.getElementById('editRooms').value,
                "الوصف التسويقي": document.getElementById('editDesc').value,
                "رابط الصور": currentEditingImages.join(', ')
            };

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedPayload)
                });

                if (response.ok) {
                    alert('تم حفظ التعديلات في بنك البيانات بنجاح!');
                    closeModal();
                    fetchProperties(); // إعادة تحميل الكروت بالبيانات الجديدة
                } else {
                    alert('حدث خطأ أثناء حفظ التعديلات.');
                }
            } catch (error) {
                console.error('Error updating:', error);
                alert('فشل الاتصال بالسيرفر.');
            } finally {
                saveBtn.innerText = 'حفظ التعديلات';
                saveBtn.disabled = false;
            }
        }

        // بدء التشغيل
        fetchProperties();
    </script>
</body>
</html>
